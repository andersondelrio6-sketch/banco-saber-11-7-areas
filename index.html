l líquido conductor.","La solución de azúcar carece por completo de partículas en movimiento."],"k":1,"e":"Al disolverse, el cloruro de sodio produce iones móviles que permiten transportar carga eléctrica por la solución. El azúcar no genera esos iones; las otras opciones atribuyen transformaciones inexistentes o confunden el movimiento de las partículas con el transporte de carga."},{"c":"En una demostración se representa la formación de óxido de hierro(III) mediante la ecuación Fe + O₂ → Fe₂O₃. Antes de interpretar las cantidades que reaccionan, se necesita balancear la ecuación. El docente recuerda que deben conservarse los átomos de cada elemento y que solo pueden modificarse los coeficientes, no los subíndices de las fórmulas.","g":null,"q":"¿Cuáles son los coeficientes enteros mínimos de Fe, O₂ y Fe₂O₃, en ese orden?","o":["2, 3 y 1.","3, 2 y 1.","4, 3 y 2.","4, 2 y 3."],"k":2,"e":"La ecuación balanceada es 4 Fe + 3 O₂ → 2 Fe₂O₃, con cuatro átomos de hierro y seis de oxígeno en cada lado. Las demás combinaciones no conservan simultáneamente la cantidad de átomos de ambos elementos."},{"c":"Un recipiente contiene 22,0 g de dióxido de carbono puro. Para relacionar esta masa con el número de partículas, una estudiante utiliza una masa molar de CO₂ de 44,0 g/mol y el número de Avogadro, 6,02 × 10²³ partículas por mol. Debe distinguir entre moléculas de dióxido de carbono y átomos que las componen.","g":null,"q":"¿Cuántas moléculas de CO₂ contiene aproximadamente el recipiente?","o":["6,02 × 10²³ moléculas.","1,20 × 10²⁴ moléculas.","9,03 × 10²³ moléculas.","3,01 × 10²³ moléculas."],"k":3,"e":"La cantidad de CO₂ es 22,0/44,0 = 0,500 mol, que contiene 0,500 × 6,02 × 10²³ = 3,01 × 10²³ moléculas. Las otras cantidades corresponden a cantidades de sustancia distintas o, en el caso de 9,03 × 10²³, al número total de átomos de la muestra."},{"c":"En un recipiente reaccionan 3,0 mol de hidrógeno con 2,0 mol de oxígeno para producir agua, según 2 H₂ + O₂ → 2 H₂O. Se supone que la reacción ocurre por completo hasta agotar uno de los reactivos y que no se forman otros productos. El grupo quiere identificar qué sustancia queda en exceso.","g":null,"q":"¿Qué resultado se obtiene al finalizar la reacción?","o":["Se forman 3,0 mol de agua y quedan 0,5 mol de oxígeno.","Se forman 4,0 mol de agua y queda 1,0 mol de hidrógeno.","Se forman 5,0 mol de agua y no queda ningún reactivo.","Se forman 1,5 mol de agua y quedan 0,5 mol de hidrógeno."],"k":0,"e":"Los 3,0 mol de H₂ consumen 1,5 mol de O₂ y producen 3,0 mol de H₂O, por lo que sobran 0,5 mol de O₂. Las demás opciones no respetan la proporción 2:1:2 de la ecuación o requieren más hidrógeno del disponible."},{"c":"Una muestra de 10,0 g de carbonato de calcio puro se calienta y se descompone según CaCO₃ → CaO + CO₂. Las masas molares son 100 g/mol para CaCO₃ y 56,0 g/mol para CaO. Al terminar, se recuperan 4,48 g de CaO seco; se desea comparar esta masa con la producción teórica.","g":null,"q":"¿Cuál es el rendimiento porcentual de obtención de CaO?","o":["44,8 %.","80,0 %.","56,0 %.","125 %."],"k":1,"e":"Los 10,0 g de CaCO₃ equivalen a 0,100 mol y permiten producir teóricamente 5,60 g de CaO. El rendimiento es (4,48/5,60) × 100 = 80,0 %; las otras opciones usan una masa de referencia incorrecta o invierten la relación entre producción real y teórica."},{"c":"Una solución diluida de ácido clorhídrico tiene una concentración de H⁺ de 1,0 × 10⁻³ mol/L. Se toman 10,0 mL y se añade agua hasta completar un volumen final de 100,0 mL. Se supone disociación completa y se desprecia el aporte de H⁺ del agua. Para calcular el pH se usa pH = −log₁₀[H⁺].","g":null,"q":"¿Cuál será el pH de la solución después de la dilución?","o":["2.","3.","4.","10."],"k":2,"e":"Al aumentar diez veces el volumen, la concentración de H⁺ disminuye a 1,0 × 10⁻⁴ mol/L y el pH resulta igual a 4. El pH 3 ignora la dilución, el pH 2 supone un aumento de concentración y el pH 10 implicaría una solución básica que no se obtiene al añadir solamente agua."},{"c":"En una titulación se colocan 25,0 mL de una solución de HCl de concentración desconocida. Para neutralizarla completamente se requieren 20,0 mL de NaOH 0,100 mol/L. La reacción es HCl + NaOH → NaCl + H₂O. Se considera que ambos reactivos se disocian completamente y reaccionan en proporción molar uno a uno.","g":null,"q":"¿Cuál es la concentración molar de la solución de HCl?","o":["0,125 mol/L.","0,100 mol/L.","0,0500 mol/L.","0,0800 mol/L."],"k":3,"e":"La base aporta 0,100 mol/L × 0,0200 L = 0,00200 mol, que neutralizan la misma cantidad de HCl. Al dividir por 0,0250 L se obtiene 0,0800 mol/L; las otras opciones no aplican correctamente la relación entre moles y volumen del ácido."},{"c":"Para preparar una solución, una estudiante pesa 5,0 g de sal y agrega agua hasta que la masa total de la solución sea 200,0 g. Toda la sal queda disuelta. El protocolo solicita expresar la concentración como porcentaje masa a masa, definido como la masa de soluto dividida entre la masa de solución, multiplicada por cien.","g":null,"q":"¿Qué concentración debe registrar la estudiante?","o":["2,5 % m/m.","2,56 % m/m.","5,0 % m/m.","40,0 % m/m."],"k":0,"e":"El porcentaje es (5,0 g/200,0 g) × 100 = 2,5 % m/m. El valor 2,56 % usa incorrectamente la masa del solvente como denominador, mientras que 5,0 % y 40,0 % no corresponden a la relación solicitada."},{"c":"Un laboratorio dispone de una solución de cloruro de sodio de 2,00 mol/L y necesita preparar 250 mL de una solución de 0,200 mol/L. La preparación se hará tomando una porción de la solución inicial y añadiendo agua hasta el volumen final indicado. Durante la dilución no se pierde soluto ni ocurre una reacción química.","g":null,"q":"¿Qué volumen de la solución inicial debe utilizarse?","o":["2,50 mL.","25,0 mL.","50,0 mL.","100 mL."],"k":1,"e":"Como los moles de soluto se conservan, C₁V₁ = C₂V₂ y V₁ = (0,200 × 250)/2,00 = 25,0 mL. Los otros volúmenes aportarían cantidades de soluto diferentes de las necesarias para obtener la concentración final indicada."},{"c":"Una cantidad fija de gas está encerrada en una jeringa sellada y ocupa 60,0 mL a una presión de 1,00 atm. El émbolo se desplaza lentamente hasta que la presión alcanza 1,50 atm, manteniendo constante la temperatura. Se considera que el gas tiene comportamiento ideal y que no hay fugas durante la compresión.","g":null,"q":"¿Cuál es el volumen final del gas?","o":["90,0 mL.","60,0 mL.","40,0 mL.","30,0 mL."],"k":2,"e":"A temperatura y cantidad de gas constantes, la ley de Boyle establece P₁V₁ = P₂V₂, por lo que V₂ = 1,00 × 60,0/1,50 = 40,0 mL. Un volumen de 90,0 mL supone proporcionalidad directa, 60,0 mL ignora la compresión y 30,0 mL correspondería a duplicar la presión."},{"c":"Un gas ideal ocupa 2,00 L a 27 °C dentro de un cilindro con un émbolo móvil. Se calienta hasta 127 °C mientras la presión permanece constante y no cambia la cantidad de gas. Para este ejercicio se usa la conversión T(K) = T(°C) + 273 y se desprecia la expansión térmica del recipiente.","g":null,"q":"¿Cuál es el volumen final aproximado?","o":["9,41 L.","1,50 L.","2,00 L.","2,67 L."],"k":3,"e":"La ley de Charles exige temperaturas absolutas: V₂ = 2,00 L × 400 K/300 K = 2,67 L. Usar grados Celsius produce 9,41 L, invertir la relación produce 1,50 L y mantener 2,00 L desconoce la expansión a presión constante."},{"c":"Dos recipientes rígidos de igual volumen contienen gases ideales a la misma temperatura. El recipiente A tiene 0,20 mol de nitrógeno y el recipiente B tiene 0,40 mol de oxígeno. Un estudiante compara sus presiones mediante la ecuación PV = nRT, sin considerar reacciones químicas ni diferencias de comportamiento respecto al modelo ideal.","g":null,"q":"¿Qué relación existe entre las presiones de los recipientes?","o":["La presión de B es el doble de la presión de A.","La presión de A es el doble de la presión de B.","Las presiones son iguales porque los volúmenes son iguales.","La presión de B es la mitad de la de A por contener oxígeno."],"k":0,"e":"Con temperatura y volumen iguales, P = nRT/V muestra que la presión es proporcional al número de moles; B contiene el doble que A. Las otras opciones invierten la relación, omiten la cantidad de gas o atribuyen al tipo de gas un efecto que no existe en el modelo ideal."},{"c":"En una actividad de química orgánica se comparan las fórmulas estructurales condensadas CH₃CH₂OH y CH₃COOH. El docente señala que los grupos funcionales permiten clasificar compuestos y anticipar algunas de sus propiedades. La primera sustancia tiene un grupo −OH unido a un carbono saturado y la segunda posee un grupo −COOH.","g":null,"q":"¿Cómo se clasifican, respectivamente, estos dos compuestos?","o":["Como aldehído y cetona.","Como alcohol y ácido carboxílico.","Como éter y alcohol.","Como ácido carboxílico y éster."],"k":1,"e":"CH₃CH₂OH es un alcohol por su grupo hidroxilo y CH₃COOH es un ácido carboxílico por su grupo carboxilo. Las demás clasificaciones requieren grupos funcionales que no aparecen en esas estructuras o asignan los grupos en un orden incorrecto."},{"c":"Una muestra de eteno, CH₂=CH₂, reacciona con hidrógeno en presencia de un catalizador apropiado. En el proceso se añade una molécula de H₂ por cada molécula de eteno y se conserva el número de átomos de carbono. El ejercicio busca relacionar la reacción de adición con el cambio en la saturación del compuesto.","g":null,"q":"¿Cuál es el producto de esta reacción?","o":["Etino, C₂H₂, con un enlace triple.","Etanol, C₂H₆O, con un grupo hidroxilo.","Etano, C₂H₆, con un enlace sencillo entre carbonos.","Metano, CH₄, con un solo átomo de carbono."],"k":2,"e":"La adición de H₂ convierte el doble enlace del eteno en un enlace sencillo y produce C₂H₆, llamado etano. El etino tiene menos hidrógenos, el etanol requeriría oxígeno y el metano no conserva los dos carbonos en una sola molécula de producto."},{"c":"Una muestra de hielo puro, inicialmente a −10 °C, recibe calor de manera continua a presión atmosférica. Su temperatura aumenta hasta 0 °C y luego permanece aproximadamente constante mientras coexisten hielo y agua líquida. Una vez que todo el hielo se funde, la temperatura del agua vuelve a aumentar con el calentamiento.","g":null,"q":"¿Por qué la temperatura permanece constante durante la fusión?","o":["Porque el hielo deja de recibir energía al alcanzar 0 °C.","Porque toda la energía recibida se transforma en masa adicional.","Porque el agua líquida elimina instantáneamente todo el calor suministrado.","Porque la energía se emplea en cambiar la organización e interacción de las partículas."],"k":3,"e":"Durante la fusión, el calor suministrado se emplea como calor latente para transformar el sólido en líquido, sin aumentar la temperatura. No se interrumpe el aporte de energía, no se genera masa adicional y tampoco se elimina instantáneamente el calor recibido."},{"c":"En una demostración, un fragmento de dióxido de carbono sólido se deja en un recipiente abierto a presión atmosférica. El sólido disminuye de tamaño y produce CO₂ gaseoso sin formar una fase líquida observable. El docente aclara que se sigue la transformación del dióxido de carbono, no la posible condensación del vapor de agua del aire.","g":null,"q":"¿Cómo se llama el cambio de estado que experimenta el dióxido de carbono?","o":["Sublimación.","Fusión.","Condensación.","Solidificación."],"k":0,"e":"La sublimación es el paso directo de sólido a gas, que corresponde al cambio descrito para el CO₂. La fusión es de sólido a líquido, la condensación de gas a líquido y la solidificación de líquido a sólido."},{"c":"Una lámina de zinc se introduce en una solución que contiene iones Cu²⁺. Ocurre la reacción Zn(s) + Cu²⁺(ac) → Zn²⁺(ac) + Cu(s). Para analizarla, un estudiante usa la regla de que los elementos libres tienen número de oxidación cero y los iones monoatómicos tienen un número de oxidación igual a su carga.","g":null,"q":"¿Cuál afirmación identifica correctamente la oxidación y la reducción?","o":["El zinc se reduce y el Cu²⁺ se oxida.","El zinc se oxida y el Cu²⁺ se reduce.","Ambas especies se oxidan porque forman productos nuevos.","Ninguna especie cambia su número de oxidación."],"k":1,"e":"El zinc pasa de 0 a +2 y pierde electrones, por lo que se oxida; el cobre pasa de +2 a 0 y gana electrones, por lo que se reduce. Las otras opciones invierten los procesos o desconocen los cambios de número de oxidación evidentes en la ecuación."},{"c":"Para investigar la corrosión, se colocan clavos de hierro idénticos en tres recipientes durante el mismo tiempo. El primero contiene aire seco; el segundo, agua hervida cubierta con aceite para minimizar el ingreso de oxígeno; el tercero, agua en contacto con el aire. La mayor formación de herrumbre se observa en el tercer recipiente.","g":null,"q":"¿Qué conclusión está mejor respaldada por esta comparación?","o":["El agua, sin participación del oxígeno, explica toda la corrosión.","El aire seco produce necesariamente la mayor corrosión.","La disponibilidad conjunta de agua y oxígeno favorece la corrosión.","El aceite acelera la oxidación del hierro en presencia de agua."],"k":2,"e":"El recipiente con agua y acceso al oxígeno presenta más herrumbre, lo que respalda que ambos factores favorecen la corrosión en estas condiciones. Las otras conclusiones contradicen los resultados o atribuyen al aceite un efecto acelerador que no se observó."},{"c":"Una pieza sólida no porosa tiene una masa de 54,0 g. Al sumergirla completamente en una probeta, sin burbujas ni derrames, el nivel del agua pasa de 30,0 mL a 50,0 mL. Se sabe que la pieza no se disuelve ni reacciona con el agua y se desea calcular su densidad mediante desplazamiento de líquido.","g":null,"q":"¿Cuál es la densidad de la pieza?","o":["1,08 g/mL.","1,80 g/mL.","0,370 g/mL.","2,70 g/mL."],"k":3,"e":"El volumen de la pieza es el volumen desplazado: 50,0 − 30,0 = 20,0 mL, y su densidad es 54,0/20,0 = 2,70 g/mL. Las dos primeras opciones usan lecturas de la probeta en lugar del desplazamiento y la tercera invierte la razón entre masa y volumen."},{"c":"La solubilidad de una sal es de 80 g por cada 100 g de agua a 60 °C y de 30 g por cada 100 g de agua a 20 °C. Se prepara una solución saturada con 100 g de agua a 60 °C y se enfría hasta 20 °C sin evaporación. Se espera hasta alcanzar el equilibrio.","g":null,"q":"¿Qué masa de sal habrá cristalizado al alcanzar 20 °C?","o":["50 g.","30 g.","80 g.","110 g."],"k":0,"e":"Inicialmente hay 80 g de sal disuelta y, a 20 °C, solo pueden permanecer disueltos 30 g en los mismos 100 g de agua; por tanto, cristalizan 50 g. Los 30 g corresponden a la sal que queda disuelta, 80 g implicaría que no queda sal en solución y 110 g supera la masa inicial de sal."}],"Física":[{"c":"Durante una prueba en una pista recta, un carrito avanza siempre en el mismo sentido. En los primeros 4 segundos mantiene una rapidez de 2 m/s y, durante los siguientes 2 segundos, mantiene una rapidez de 6 m/s. Un estudiante quiere describir todo el recorrido mediante una sola rapidez promedio.","g":null,"q":"¿Cuál es la rapidez promedio del carrito durante los 6 segundos de la prueba?","o":["4 m/s","Aproximadamente 3,33 m/s","8 m/s","Aproximadamente 1,67 m/s"],"k":1,"e":"El carrito recorre 2 × 4 = 8 m en el primer tramo y 6 × 2 = 12 m en el segundo. La rapidez promedio es la distancia total dividida entre el tiempo total: 20/6 ≈ 3,33 m/s. Las otras opciones no ponderan correctamente los tiempos o no utilizan la distancia total."},{"c":"Una motocicleta se mueve por una carretera recta hacia el oriente. Al comenzar una observación, su velocidad es de 3 m/s; seis segundos después, su velocidad es de 15 m/s en el mismo sentido. Durante ese intervalo, la velocidad aumenta de manera uniforme y no hay cambios de dirección.","g":null,"q":"¿Cuál es la aceleración de la motocicleta durante el intervalo observado?","o":["0,5 m/s² hacia el oriente","3 m/s² hacia el oriente","2 m/s² hacia el oriente","12 m/s² hacia el oriente"],"k":2,"e":"La aceleración es el cambio de velocidad dividido entre el tiempo: (15 − 3)/6 = 2 m/s². Como la velocidad aumenta hacia el oriente, la aceleración apunta en ese sentido. Las otras opciones resultan de invertir la relación, sumar las velocidades o no dividir el cambio entre el tiempo."},{"c":"Una estudiante lanza una pelota verticalmente hacia arriba desde el patio de su colegio. La pelota asciende, alcanza una altura máxima y luego desciende. Para analizar el movimiento, se desprecia la resistencia del aire y se considera que la gravedad permanece constante durante todo el recorrido, incluso en el punto más alto.","g":null,"q":"¿Cómo son la velocidad y la aceleración de la pelota exactamente en el punto más alto?","o":["La velocidad y la aceleración son nulas.","La velocidad apunta hacia arriba y la aceleración es nula.","La velocidad es nula y la aceleración apunta hacia arriba.","La velocidad es nula y la aceleración apunta hacia abajo."],"k":3,"e":"En el punto más alto, la pelota cambia de sentido y su velocidad instantánea es cero. Sin embargo, la fuerza gravitacional sigue actuando, por lo que la aceleración apunta hacia abajo. Las otras opciones confunden la detención instantánea con ausencia de aceleración o asignan direcciones incorrectas."},{"c":"Un estudiante arrastra una caja de 3 kg sobre un piso horizontal mediante una fuerza horizontal de 18 N hacia la derecha. El piso ejerce una fuerza de fricción de 6 N hacia la izquierda. La caja no se mueve verticalmente, pues su peso está equilibrado por la fuerza normal del piso.","g":null,"q":"¿Cuál es la aceleración horizontal de la caja?","o":["4 m/s² hacia la derecha","6 m/s² hacia la derecha","8 m/s² hacia la derecha","4 m/s² hacia la izquierda"],"k":0,"e":"La fuerza horizontal neta es 18 − 6 = 12 N hacia la derecha. Según la segunda ley de Newton, a = F/m = 12/3 = 4 m/s². Las otras opciones ignoran la fricción, suman fuerzas opuestas o invierten la dirección de la fuerza neta."},{"c":"En una piscina, una nadadora impulsa el agua hacia atrás con sus manos y comienza a avanzar hacia adelante. Un compañero afirma que esto ocurre porque las fuerzas de acción y reacción se anulan. Para evaluar la afirmación, se distinguen las fuerzas que actúan sobre la nadadora de las que actúan sobre el agua.","g":null,"q":"¿Cuál explicación describe correctamente el par de acción y reacción asociado con el impulso de las manos?","o":["Ambas fuerzas actúan sobre la nadadora y se cancelan.","La nadadora empuja el agua hacia atrás y el agua la empuja hacia adelante.","La fuerza de la nadadora sobre el agua es mayor que la fuerza del agua sobre ella.","El agua empuja a la nadadora únicamente después de que ella deja de empujarla."],"k":1,"e":"La tercera ley de Newton establece que las fuerzas del par tienen igual magnitud y sentidos opuestos, pero actúan sobre cuerpos distintos. Por eso, la fuerza sobre el agua no cancela la fuerza sobre la nadadora. Las demás opciones ubican ambas fuerzas en un mismo cuerpo, les asignan magnitudes diferentes o suponen que ocurren en momentos separados."},{"c":"Un bus viaja por una vía recta con rapidez constante. Una pasajera permanece de pie y no está sujetándose de las barras. Cuando el conductor frena de manera repentina, la pasajera tiende a inclinarse hacia la parte delantera del vehículo, aunque antes de frenar estaba en reposo respecto al bus.","g":null,"q":"¿Qué principio explica principalmente el movimiento de la pasajera respecto al bus durante el frenado?","o":["La gravedad aumenta cuando el bus reduce su rapidez.","Aparece necesariamente una fuerza real que empuja su torso hacia adelante.","Su cuerpo tiende a conservar la velocidad que tenía antes del frenado.","La fuerza normal del piso desaparece durante el frenado."],"k":2,"e":"Por inercia, el cuerpo de la pasajera tiende a mantener su velocidad mientras el bus disminuye la suya. Así, respecto al vehículo, la pasajera se desplaza hacia adelante. No es necesario un empuje real hacia adelante, y el fenómeno no requiere cambios en la gravedad ni desaparición de la fuerza normal."},{"c":"Un bloque parte del reposo en la parte superior de una rampa y desciende hasta su base. La diferencia de altura entre ambos puntos es de 5 m. La superficie no presenta fricción y la resistencia del aire es despreciable. Para el cálculo, se utiliza una aceleración gravitacional de 10 m/s².","g":null,"q":"¿Con qué rapidez llega el bloque a la base de la rampa?","o":["5 m/s","Aproximadamente 7,07 m/s","50 m/s","10 m/s"],"k":3,"e":"Sin fricción, la energía potencial perdida se transforma en energía cinética: mgh = mv²/2. Por tanto, v = √(2gh) = √100 = 10 m/s, independientemente de la masa. Las demás opciones omiten el factor 2, confunden energía por unidad de masa con rapidez o aplican una relación incorrecta."},{"c":"Una persona lleva una bandeja a una altura constante mientras camina 8 m por un pasillo horizontal. La fuerza que sus manos ejercen sobre la bandeja es vertical hacia arriba y equilibra su peso. Se analiza únicamente el trabajo mecánico de esa fuerza vertical durante el desplazamiento horizontal, no el gasto energético del cuerpo.","g":null,"q":"¿Qué trabajo realiza sobre la bandeja la fuerza vertical ejercida por las manos?","o":["0 J","Un trabajo positivo igual al peso multiplicado por 8 m","Un trabajo negativo igual al peso multiplicado por 8 m","Un trabajo positivo cuyo valor depende únicamente del tiempo de caminata"],"k":0,"e":"El trabajo de una fuerza es W = Fd cos θ. Como la fuerza vertical y el desplazamiento horizontal forman 90°, el trabajo es cero. Las otras opciones ignoran la orientación de la fuerza o confunden el trabajo mecánico con el gasto energético y el tiempo."},{"c":"Un pequeño motor eleva verticalmente una carga de 20 kg desde el suelo hasta una plataforma situada a 3 m de altura. El ascenso tarda 6 segundos y se realiza con rapidez constante. Se desprecia la fricción del mecanismo y se toma g = 10 m/s² para calcular la potencia mecánica entregada a la carga.","g":null,"q":"¿Cuál es la potencia mecánica promedio entregada por el motor a la carga?","o":["60 W","100 W","600 W","3 600 W"],"k":1,"e":"El trabajo realizado es el aumento de energía potencial: W = mgh = 20 × 10 × 3 = 600 J. La potencia promedio es P = W/t = 600/6 = 100 W. Las otras opciones omiten factores, confunden trabajo con potencia o multiplican por el tiempo en lugar de dividir."},{"c":"En una práctica de electricidad, una resistencia de 8 Ω se conecta directamente a una fuente ideal que mantiene una diferencia de potencial de 24 V. Los cables tienen resistencia despreciable y el componente se comporta de acuerdo con la ley de Ohm. Un amperímetro ideal se instala en serie para medir la corriente.","g":null,"q":"¿Qué corriente debe indicar el amperímetro?","o":["0,33 A","16 A","3 A","192 A"],"k":2,"e":"La ley de Ohm establece I = V/R, de modo que I = 24/8 = 3 A. La conexión en serie permite que el amperímetro mida la corriente de la resistencia. Las otras opciones invierten la división, restan cantidades de unidades distintas o multiplican voltaje y resistencia."},{"c":"Dos resistencias, una de 6 Ω y otra de 3 Ω, se conectan en paralelo a una batería ideal de 12 V. Cada resistencia queda conectada entre los mismos dos terminales de la batería. Los cables tienen resistencia despreciable y se desea conocer la corriente total que entrega la batería al conjunto.","g":null,"q":"¿Cuál es la corriente total suministrada por la batería?","o":["Aproximadamente 1,33 A","2 A","4 A","6 A"],"k":3,"e":"En paralelo, cada resistencia recibe los 12 V de la batería. Las corrientes son 12/6 = 2 A y 12/3 = 4 A, por lo que la corriente total es 6 A. La primera opción corresponde a sumar las resistencias como si estuvieran en serie, y las otras dos consideran solo una rama."},{"c":"Un calentador eléctrico se modela como una resistencia conectada a una fuente ideal de voltaje constante. Un técnico reemplaza esa resistencia por otra cuyo valor es el doble. Se supone que ambas resistencias mantienen sus valores durante el funcionamiento y que no se modifica el voltaje suministrado por la fuente.","g":null,"q":"¿Cómo cambia la potencia eléctrica consumida después del reemplazo?","o":["Se reduce a la mitad.","Se duplica.","Se mantiene igual.","Se reduce a la cuarta parte."],"k":0,"e":"A voltaje constante, la potencia de una resistencia es P = V²/R. Al duplicar R, la potencia queda dividida entre dos. No se duplica ni permanece igual, y la reducción a la cuarta parte correspondería a cuadruplicar la resistencia."},{"c":"Un parlante emite un tono puro de frecuencia 680 Hz en un salón. Para las condiciones del lugar, la rapidez del sonido en el aire es de 340 m/s. El tono se propaga sin cambiar de medio y se quiere determinar la separación espacial entre dos compresiones consecutivas de la onda sonora.","g":null,"q":"¿Cuál es la longitud de onda del sonido emitido?","o":["2 m","0,50 m","340 m","0,00294 m"],"k":1,"e":"La longitud de onda se obtiene con λ = v/f = 340/680 = 0,50 m. Esta distancia corresponde a la separación entre compresiones consecutivas. Las otras opciones invierten la relación, toman la rapidez como longitud o utilizan el inverso de la rapidez."},{"c":"Una alarma funciona dentro de una campana transparente conectada a una bomba de vacío. Al retirar progresivamente el aire, una estudiante sigue viendo que el mecanismo de la alarma vibra, pero escucha un sonido cada vez más débil. Se supone que el aislamiento evita que las vibraciones lleguen al exterior a través del soporte.","g":null,"q":"¿Qué explicación física corresponde a la disminución del sonido percibido?","o":["La luz deja de propagarse cuando disminuye la cantidad de aire.","La frecuencia de cualquier vibración se vuelve cero al retirar el aire.","El sonido necesita un medio material para transportar la perturbación.","El sonido se transforma completamente en luz dentro de la campana."],"k":2,"e":"El sonido es una onda mecánica que necesita un medio material para propagarse. Al reducir el aire, disminuye la transmisión acústica, aunque el mecanismo pueda seguir vibrando y siendo visible. Las otras opciones atribuyen al vacío efectos que no son necesarios ni explican el fenómeno observado."},{"c":"En un laboratorio se calientan 0,20 kg de agua, cuya temperatura pasa de 20 °C a 30 °C. Durante el proceso no hay evaporación y se desprecia la energía absorbida por el recipiente. El calor específico del agua se considera constante e igual a 4 200 J/(kg·°C).","g":null,"q":"¿Cuánta energía térmica absorbe el agua?","o":["840 J","42 000 J","25 200 J","8 400 J"],"k":3,"e":"El calor absorbido es Q = mcΔT, con ΔT = 30 − 20 = 10 °C. Así, Q = 0,20 × 4 200 × 10 = 8 400 J. Las otras opciones omiten la masa, usan la temperatura final en vez del cambio o calculan incorrectamente el producto."},{"c":"Se mezclan 200 g de agua a 20 °C con 200 g de agua a 60 °C en un recipiente térmicamente aislado. Se desprecia la capacidad térmica del recipiente y no ocurre evaporación. Ambas porciones tienen el mismo calor específico y se espera hasta que toda el agua alcance una temperatura uniforme.","g":null,"q":"¿Cuál será la temperatura final de equilibrio?","o":["40 °C","80 °C","30 °C","60 °C"],"k":0,"e":"El calor que pierde el agua caliente es igual al que gana el agua fría. Como las masas y los calores específicos son iguales, la temperatura final es (20 + 60)/2 = 40 °C. Las otras opciones no equilibran los intercambios de calor o suman temperaturas indebidamente."},{"c":"Un sensor mide la presión debida únicamente al agua de una piscina, es decir, la presión manométrica sin incluir la atmosférica. Primero se ubica a 2 m bajo la superficie y luego a 5 m. La densidad del agua y la aceleración gravitacional se consideran constantes en ambas posiciones.","g":null,"q":"¿Qué relación existe entre la presión manométrica a 5 m y la presión manométrica a 2 m?","o":["La presión a 5 m es 0,4 veces la presión a 2 m.","La presión a 5 m es 2,5 veces la presión a 2 m.","Las presiones son iguales porque se trata del mismo líquido.","La presión a 5 m es 3 veces la presión a 2 m."],"k":1,"e":"La presión manométrica en un líquido en reposo es p = ρgh. Con densidad y gravedad constantes, la razón de presiones es 5/2 = 2,5. Las otras opciones invierten la razón, ignoran la profundidad o confunden su diferencia con su proporción."},{"c":"Un objeto rígido de volumen 0,003 m³ y peso 24 N se mantiene completamente sumergido en agua mediante una mano. La densidad del agua es 1 000 kg/m³ y g = 10 m/s². Al soltarlo, no toca paredes ni fondo; para analizar el instante inicial, se desprecia la resistencia del agua al movimiento.","g":null,"q":"¿Qué sucede con el objeto inmediatamente después de soltarlo?","o":["Acelera hacia abajo porque su peso supera al empuje.","Permanece en equilibrio porque todo objeto sumergido recibe un empuje igual a su peso.","Acelera hacia arriba porque el empuje supera su peso en 6 N.","Acelera hacia arriba porque el empuje supera su peso en 30 N."],"k":2,"e":"El empuje es el peso del agua desplazada: E = ρgV = 1 000 × 10 × 0,003 = 30 N. La fuerza neta inicial es 30 − 24 = 6 N hacia arriba. Las otras opciones comparan mal las fuerzas, suponen equilibrio automático o confunden el empuje con la fuerza neta."},{"c":"Un rayo de luz llega a un espejo plano formando un ángulo de 35° con la normal, una línea perpendicular al espejo en el punto de incidencia. El rayo se refleja en el mismo plano que contiene al rayo incidente y a la normal. Se comparan las dos trayectorias a ambos lados de esta línea.","g":null,"q":"¿Cuál es el ángulo entre el segmento del rayo incidente que llega al espejo y el rayo reflejado, medido en el lado donde se encuentra la luz?","o":["35°","55°","110°","70°"],"k":3,"e":"La ley de reflexión indica que el ángulo reflejado respecto a la normal también es 35°. Las dos trayectorias quedan a lados opuestos de la normal, por lo que el ángulo entre ellas es 35° + 35° = 70°. Las otras opciones representan un solo ángulo, su complemento o el ángulo suplementario del solicitado."},{"c":"Un haz de luz pasa del aire a una placa de vidrio transparente. El rayo incide oblicuamente sobre la superficie y el vidrio tiene un índice de refracción mayor que el aire. Se analiza el rayo transmitido, no el reflejado, y se considera que la superficie de separación es plana.","g":null,"q":"¿Qué cambios experimenta la luz al entrar en el vidrio?","o":["Disminuye su rapidez y se desvía hacia la normal.","Aumenta su rapidez y se desvía alejándose de la normal.","Disminuye su rapidez y conserva necesariamente su dirección.","Mantiene su rapidez y aumenta su frecuencia."],"k":0,"e":"Un índice de refracción mayor implica una rapidez menor, según v = c/n. Por la ley de Snell, al pasar oblicuamente a ese medio, el rayo se acerca a la normal y conserva su frecuencia. Las otras opciones contradicen estas relaciones o atribuyen a una incidencia oblicua el comportamiento de una incidencia normal."},{"c":"Para estudiar la gravedad, se modela la Tierra como una esfera de radio R cuya masa está distribuida de manera esféricamente simétrica. En la superficie, la aceleración gravitacional tiene magnitud g₀. Se desea compararla con la aceleración a una altura R sobre la superficie, sin considerar la rotación terrestre ni otros cuerpos celestes.","g":null,"q":"¿Cuál es la magnitud de la aceleración gravitacional a esa altura?","o":["g₀/2","g₀/4","g₀","2g₀"],"k":1,"e":"A una altura R sobre la superficie, la distancia al centro terrestre es 2R. Como g = GM/r², duplicar esa distancia reduce la aceleración a g₀/4. Las otras opciones suponen una dependencia inversa lineal, ninguna dependencia o un aumento con la distancia."},{"c":"Desde una plataforma situada a 45 m sobre el suelo se suelta una pequeña esfera sin darle impulso inicial. La esfera cae verticalmente y se desprecia la resistencia del aire. En todo el recorrido se toma g = 10 m/s², y el suelo se encuentra al mismo nivel de referencia usado para medir la altura.","g":null,"q":"¿Cuánto tiempo tarda la esfera en llegar al suelo?","o":["4,5 s","9 s","3 s","Aproximadamente 2,12 s"],"k":2,"e":"En una caída desde el reposo, h = gt²/2. Por tanto, t = √(2h/g) = √(90/10) = 3 s. Las otras opciones tratan la aceleración como una rapidez, omiten la raíz cuadrada o dejan fuera el factor 2."},{"c":"Sobre una pista horizontal de fricción despreciable, un carrito de 2 kg se mueve hacia la derecha a 6 m/s y choca con otro de 1 kg que está en reposo. Después del choque, los carritos quedan unidos. Durante la colisión, el impulso externo horizontal sobre el conjunto es despreciable.","g":null,"q":"¿Cuál es la velocidad de los carritos unidos inmediatamente después del choque?","o":["2 m/s hacia la derecha","6 m/s hacia la derecha","12 m/s hacia la derecha","4 m/s hacia la derecha"],"k":3,"e":"Se conserva el momento lineal: 2 × 6 + 1 × 0 = (2 + 1)v. De esta igualdad resulta v = 12/3 = 4 m/s hacia la derecha. Las demás opciones dividen entre una masa incorrecta, conservan indebidamente la rapidez inicial o confunden momento con velocidad."},{"c":"Un dispositivo de lanzamiento está inicialmente en reposo sobre una superficie horizontal sin fricción. Al activarse, expulsa una pequeña pieza de 0,020 kg hacia la derecha a 300 m/s respecto al suelo. La masa del dispositivo después de expulsarla es de 3,0 kg y el impulso externo horizontal durante el lanzamiento es despreciable.","g":null,"q":"¿Cuál es la velocidad del dispositivo inmediatamente después del lanzamiento, medida respecto al suelo?","o":["2 m/s hacia la izquierda","2 m/s hacia la derecha","6 m/s hacia la izquierda","100 m/s hacia la izquierda"],"k":0,"e":"El momento inicial total es cero, de modo que 0,020 × 300 + 3,0v = 0. Así, v = −2 m/s, donde el signo negativo indica movimiento hacia la izquierda. Las otras opciones invierten el sentido o no relacionan correctamente los momentos de la pieza y del dispositivo."},{"c":"Dos carritos de igual masa se encuentran sobre una pista horizontal sin fricción. El primero avanza a 4 m/s hacia la derecha y el segundo está en reposo. Chocan frontalmente en una colisión perfectamente elástica y sin impulso externo horizontal apreciable, de manera que se conservan el momento lineal y la energía cinética.","g":null,"q":"¿Cómo quedan sus velocidades después de que termina la colisión?","o":["Ambos avanzan hacia la derecha a 2 m/s.","El primero queda en reposo y el segundo avanza hacia la derecha a 4 m/s.","El primero retrocede a 4 m/s y el segundo permanece en reposo.","El primero queda en reposo y el segundo avanza hacia la derecha a 8 m/s."],"k":1,"e":"En una colisión elástica frontal entre masas iguales, los carritos intercambian sus velocidades. El primero se detiene y el segundo sale a 4 m/s, conservando tanto el momento como la energía cinética. La primera opción pierde energía cinética, la tercera invierte el momento total y la cuarta aumenta indebidamente el momento y la energía."}],"Inglés":[{"c":"At a community swimming pool, visitors see this notice beside the entrance: \"Children under twelve must be accompanied by an adult. No exceptions.\" Daniel is ten years old and wants to swim while his mother shops nearby. His sixteen-year-old cousin offers to wait outside the pool, but no adult plans to enter with him.","g":null,"q":"What must Daniel do to follow the notice?","o":["Enter the pool with an adult who stays with him.","Ask his cousin to wait near the entrance.","Carry a written permission note from his mother.","Wait until the pool is less crowded."],"k":0,"e":"El aviso exige que los menores de doce años estén acompañados por un adulto, por lo que Daniel debe entrar con uno. Un primo de dieciséis años no cumple esa condición, y ni una autorización escrita ni una menor cantidad de visitantes sustituyen el acompañamiento."},{"c":"A student finds this notice on the school library door: \"Returns only after 4 p.m. Please place books in the blue box. Borrowing services resume tomorrow at 8 a.m.\" It is now 4:30 p.m. The student has finished one novel and wants to take home another one before leaving school.","g":null,"q":"Which action is allowed at that time?","o":["Borrow a novel by leaving a note for the librarian.","Return the finished novel through the blue box.","Exchange the finished novel for any book on a shelf.","Collect a new novel at the library desk."],"k":1,"e":"Después de las cuatro solo se permiten devoluciones, y el aviso indica que deben hacerse en la caja azul. Las otras opciones implican obtener otro libro, pero el servicio de préstamo no se reanuda hasta el día siguiente."},{"c":"Lucía and Owen are preparing a class presentation. Lucía has completed the slides, but she is worried about her pronunciation. She says, \"Could you listen while I practise and tell me which words are unclear?\" Owen has fifteen free minutes and wants to respond positively to her request.","g":null,"q":"Which is the most appropriate reply from Owen?","o":["You should have sent the slides yesterday.","I do not know when the presentation ends.","Of course. Start whenever you are ready.","Thanks, but I have already practised mine."],"k":2,"e":"La respuesta correcta acepta de manera amable la solicitud de escuchar y dar retroalimentación. Las demás cambian de tema, expresan un reproche o interpretan la petición como si Lucía hubiera ofrecido ayuda."},{"c":"During a school trip, Amir accidentally knocks a bottle of water onto Julia's notebook. He immediately picks up the bottle and says, \"I'm really sorry. I didn't see your notebook there.\" Julia notices that only the cover is wet and wants to reassure him without pretending that nothing happened.","g":null,"q":"What would Julia most naturally say?","o":["Congratulations! You did a wonderful job.","Yes, I would like another bottle, please.","I agree; notebooks are usually expensive.","Don't worry. The pages are still dry."],"k":3,"e":"La respuesta correcta tranquiliza a Amir y explica que el daño es limitado porque las páginas siguen secas. Las otras respuestas no corresponden a una disculpa por un accidente: felicitan, piden algo o expresan un acuerdo sin relación."},{"c":"Rosa is writing a journal entry about a finished school trip. The entry begins: \"Last Friday, our class visited a nature reserve. We observed several birds and took photographs near the lake. Before returning to school that same afternoon, we ______ a short talk by a park guide about protecting local animals.\"","g":null,"q":"Which verb form correctly completes the entry?","o":["attend","attended","will attend","are attending"],"k":1,"e":"Se necesita el pasado simple «attended» porque la charla ocurrió durante una excursión terminada el viernes pasado. Las otras formas sitúan la acción en el presente o en el futuro, en contradicción con el contexto."},{"c":"Maya usually walks to school, but heavy rain has changed her plans today. Her brother calls at this moment and asks where she is. She replies, \"I am at the bus stop. I ______ for the next bus right now because the streets are too wet to walk comfortably.\"","g":null,"q":"Which expression best completes Maya's reply?","o":["am waiting","waited","have waited yesterday","will waiting"],"k":0,"e":"«Am waiting» expresa una acción que está ocurriendo en el momento de hablar, como indica «right now». «Waited» corresponde al pasado, «have waited yesterday» combina incorrectamente el presente perfecto con un tiempo pasado definido y «will waiting» tiene una estructura incorrecta."},{"c":"Leo moved to this neighborhood in 2022 and still lives here. He is introducing himself to a new neighbor today. He wants to explain that his residence began in the past and continues in the present, so he says, \"I ______ in this neighborhood since 2022, and I really enjoy it.\"","g":null,"q":"Which option completes the sentence correctly?","o":["am living","live","had lived","have lived"],"k":3,"e":"El presente perfecto «have lived» conecta el inicio de la residencia en el pasado con su continuidad actual. Con «since 2022», las formas presentes propuestas no expresan correctamente esa duración, y «had lived» requeriría un punto de referencia pasado."},{"c":"A school gardening club tried growing tomatoes in two places. The plants beside the sunny fence produced many tomatoes, while those under a large tree produced very few. In their report, the students wrote, \"Sunlight was a crucial factor in the success of our tomato plants.\" They recommended choosing a sunny area next time.","g":null,"q":"What does \"crucial\" mean in this context?","o":["Unexpected","Temporary","Essential","Dangerous"],"k":2,"e":"«Crucial» significa esencial o de gran importancia; la comparación muestra que la luz influyó de manera decisiva en la producción. El texto no presenta la luz como inesperada, temporal ni peligrosa."},{"c":"Nora received a jacket as a birthday gift, but it was too small. She took it to the shop with the receipt. The assistant explained that she could choose a larger jacket for the same price. Nora wrote to her aunt, \"The shop let me exchange it, so now it fits perfectly.\"","g":null,"q":"What does \"exchange it\" mean in Nora's message?","o":["Replace it with another jacket.","Repair its damaged material.","Sell it to another customer.","Keep it without making changes."],"k":0,"e":"En este contexto, «exchange» significa cambiar la chaqueta por otra, específicamente por una talla mayor. No se habla de repararla, venderla ni conservarla sin cambios, pues el problema era que quedaba pequeña."},{"c":"A school started a bicycle club to encourage students to cycle safely. At first, only experienced cyclists joined. The organizers then offered beginner lessons and lent helmets to students who did not own one. Within a month, several students who had never cycled to school joined the club and began attending regularly.","g":null,"q":"Which conclusion is best supported by the passage?","o":["Experienced cyclists stopped using their bicycles.","Practical support helped more beginners participate.","Students joined mainly to receive free bicycles.","The club replaced all other school activities."],"k":1,"e":"Las clases para principiantes y el préstamo de cascos redujeron obstáculos para participar, y después se incorporaron estudiantes sin esa experiencia. No se afirma que los ciclistas expertos abandonaran la actividad, que se regalaran bicicletas ni que se eliminaran otras actividades."},{"c":"Emma enjoys reading, but she used to choose only books with familiar settings. Her teacher suggested a novel about a teenager living on a small island. Emma initially found the setting strange. As she read, however, she recognized the character's worries about friendship and family. She later said the unfamiliar setting made the story more interesting.","g":null,"q":"How did Emma's attitude change?","o":["She decided that family stories were no longer interesting.","She became less willing to read about unfamiliar places.","She discovered that an unfamiliar setting could be enjoyable.","She concluded that island life was identical to her own."],"k":2,"e":"Emma pasó de encontrar extraño el escenario a considerarlo un elemento que hacía más interesante la novela. Las otras opciones contradicen ese cambio o exageran la semejanza entre sus experiencias y la vida del personaje."},{"c":"A neighborhood café began serving drinking water in reusable glasses instead of disposable cups. Some customers worried that service would become slower. After two weeks, the manager reported that waiting times had stayed the same and that the café was throwing away far fewer cups. Customers could still request disposable cups for takeaway drinks.","g":null,"q":"What is the main idea of the passage?","o":["The café stopped selling drinks to takeaway customers.","Reusable glasses caused longer waits for everyone.","Customers refused to support any environmental changes.","The café reduced cup waste without slowing its service."],"k":3,"e":"El texto destaca dos resultados: disminuyó el desperdicio de vasos y se mantuvieron los tiempos de espera. Las otras opciones contradicen información explícita o atribuyen a todos los clientes una oposición que el pasaje no describe."},{"c":"A visitor asks how to find the art room in a school hallway. The receptionist explains that three rooms stand next to one another in this order: the music room, the art room, and the computer room. She adds, \"The art room is ______ the music room and the computer room, so you cannot miss it.\"","g":null,"q":"Which preposition correctly completes the directions?","o":["above","through","between","outside"],"k":2,"e":"«Between» indica que el salón de arte se encuentra entre los otros dos salones. «Above», «through» y «outside» describen relaciones espaciales distintas que no coinciden con el orden presentado."},{"c":"Isabel is organizing a study group. Her message says, \"We will meet ______ Monday afternoon in the school courtyard. Please bring your notes and a pencil. If it rains, we will use the classroom beside the courtyard instead. The meeting will begin after our final lesson and will last about forty minutes.\"","g":null,"q":"Which preposition belongs in the blank?","o":["on","at","in","by"],"k":0,"e":"Se usa «on» con días específicos, incluso cuando se añade una parte del día, como en «on Monday afternoon». «At» se usa normalmente para horas, «in» para períodos generales y «by» marcaría un plazo, no el momento programado de la reunión."},{"c":"The school is planning an outdoor concert tomorrow. The weather forecast suggests that rain is possible, but not certain. The principal has prepared an alternative location and tells the students, \"If it rains tomorrow, we ______ the concert in the gym. Please check the school message before leaving home.\"","g":null,"q":"Which option correctly expresses the planned result of a possible future condition?","o":["held","will hold","would have held","holding"],"k":1,"e":"El primer condicional combina «if» más presente simple con «will» más verbo para expresar una posibilidad futura y su consecuencia. Las otras opciones expresan pasado, una consecuencia hipotética pasada o una forma verbal incompleta."},{"c":"Tom wants to join a weekend photography course, but he currently has no free time because he works on Saturdays and Sundays. He is imagining a different situation rather than announcing a real plan. He tells his friend, \"If I had free weekends, I ______ the photography course, but my work schedule makes that impossible now.\"","g":null,"q":"Which phrase best completes Tom's hypothetical statement?","o":["have joined","will join","joined","would join"],"k":3,"e":"«Would join» completa un segundo condicional que expresa una situación hipotética contraria a la realidad actual. Las otras formas no corresponden a la consecuencia de «If I had» en este contexto imaginario."},{"c":"A student is completing a report about a group project: \"We wanted to interview the oldest residents in our neighborhood. Several people were happy to participate. ______, two interviews had to be postponed because the residents were away. We used the extra time to organize our questions and test the recording equipment.\"","g":null,"q":"Which connector best expresses the contrast in the report?","o":["However","Therefore","For example","Similarly"],"k":0,"e":"«However» introduce el contraste entre la disposición a participar y el aplazamiento de algunas entrevistas. «Therefore» indicaría una consecuencia, «For example» introduciría un ejemplo y «Similarly» señalaría semejanza, relaciones que aquí no corresponden."},{"c":"The school newspaper is describing a volunteer project: \"Our team collected used books for a children's center. First, we checked that every book was clean and complete. Next, we sorted them by reading level. Finally, we delivered the collection. The center thanked us because the books would help children ______ their reading skills.\"","g":null,"q":"Which word best completes the final sentence?","o":["borrow","arrive","improve","invite"],"k":2,"e":"«Improve their reading skills» significa mejorar las habilidades lectoras y expresa el beneficio esperado de los libros. Los otros verbos no forman una combinación coherente con «their reading skills» ni describen ese propósito."},{"c":"Subject: Friday rehearsal. Hi everyone, the auditorium will be used for a parents' meeting on Friday, so our drama rehearsal will take place in Room 12 instead. The starting time remains 3:30 p.m. Please bring your scripts as usual and tell any group member who may not check their email today. Thanks, Ms. Green.","g":null,"q":"What is the main purpose of this email?","o":["To invite students to perform at a parents' meeting.","To ask students to write new drama scripts.","To announce that Friday's rehearsal is cancelled.","To inform the group about a change of rehearsal location."],"k":3,"e":"El correo informa que el ensayo cambia del auditorio al salón 12, mientras conserva su horario. No cancela el ensayo, no invita a actuar en la reunión de padres y no solicita escribir guiones nuevos."},{"c":"Hi Ben, thanks for offering to help me move my science project. Could you meet me outside the laboratory at 2 p.m. tomorrow? The model is too large for me to carry safely alone. We only need to take it to the classroom upstairs. If that time does not work, please suggest another one before lunch. Ana.","g":null,"q":"What does Ana mainly want Ben to do?","o":["Finish building the science model before tomorrow.","Confirm or adjust a time to help carry the project.","Ask the teacher to move the class downstairs.","Explain why the laboratory closes at lunchtime."],"k":1,"e":"Ana busca coordinar la ayuda para transportar el proyecto: propone una hora y pide otra si Ben no puede asistir. No solicita construir el modelo, cambiar el salón de clase ni explicar el horario del laboratorio."},{"c":"Three students are comparing their journeys to school. Paula takes twenty minutes, Andrés takes thirty-five minutes, and Lina takes fifty minutes. All three leave home at the same time and travel directly to school. Their teacher asks them to describe Paula's journey in relation to the other two journeys using a correct comparison.","g":null,"q":"Which statement is both grammatically correct and supported by the information?","o":["Paula's journey is the shortest of the three.","Paula's journey is longer than Andrés's.","Lina's journey is the most short of the three.","Andrés's journey is shorter than Paula's."],"k":0,"e":"Veinte minutos es la menor duración, y «the shortest» es el superlativo correcto de «short». Las comparaciones sobre Andrés y Paula invierten los datos, y la afirmación sobre Lina es incorrecta tanto por su contenido como por la forma «most short»."},{"c":"A chemistry teacher gives safety instructions before an experiment. Students will handle a liquid that can irritate their eyes. The teacher says, \"Wearing safety goggles is compulsory during this activity. Students without goggles cannot begin.\" Mateo wants to summarize the instruction accurately for a classmate who arrived late.","g":null,"q":"Which sentence correctly expresses the teacher's requirement?","o":["You might wear goggles if you feel like it.","You must not wear goggles during the experiment.","You must wear goggles to take part in the activity.","You need not wear goggles if you work carefully."],"k":2,"e":"«Must» expresa una obligación, que coincide con el uso obligatorio de gafas de seguridad. «Might» presenta una posibilidad, «must not» expresa prohibición y «need not» elimina la obligación; ninguna refleja la instrucción."},{"c":"Sofía and Elena are working on a history poster. Sofía has researched the dates, while Elena has collected photographs. Their teacher writes, \"Elena should send the photographs to Sofía so that she can place them next to the dates she has researched.\" The teacher uses \"them\" to avoid repeating a noun.","g":null,"q":"What does \"them\" refer to in the teacher's message?","o":["The researched dates","The collected photographs","The two students","The teacher's instructions"],"k":1,"e":"«Them» se refiere a las fotografías, que Sofía debe colocar junto a las fechas. Las fechas son la referencia de ubicación, mientras que las estudiantes y las instrucciones no son los elementos que se colocarán en el cartel."},{"c":"A teacher prepared thirty worksheets for a class of thirty students, but five extra students joined the lesson unexpectedly. Every student needs one worksheet, and no student can share a copy. The teacher counts the worksheets and says, \"We do not have ______ worksheets for everyone. I need to print five more copies.\"","g":null,"q":"Which quantifier correctly completes the teacher's statement?","o":["much","little","any","enough"],"k":3,"e":"«Enough» indica cantidad suficiente; treinta copias no alcanzan para treinta y cinco estudiantes. «Much» y «little» se usan con sustantivos incontables, mientras que «not have any» afirmaría que no hay ninguna copia, lo cual contradice el contexto."},{"c":"Carla must arrive at a workshop by 9:00 a.m. She can take a direct bus that leaves at 8:10, takes forty minutes, and costs 6,000 pesos. Alternatively, she can take a local bus that leaves at 8:00, takes fifty minutes, and costs 4,000 pesos. From either bus stop, she must walk five minutes to the workshop.","g":null,"q":"Which option gets Carla to the workshop on time at the lower cost?","o":["The direct bus, arriving at the workshop at 8:50.","Neither bus, because both arrive after 9:00.","The local bus, arriving at the workshop at 8:55.","Either bus, because their fares are equal."],"k":2,"e":"El bus local llega a las 8:50 y, tras cinco minutos de caminata, Carla alcanza el taller a las 8:55 por 4.000 pesos. El directo también permite llegar a las 8:55, pero cuesta más; las otras opciones omiten la caminata, sitúan erróneamente la llegada después de las nueve o igualan tarifas diferentes."}],"Sociales y ciudadanas":[{"c":"Una estudiante de un colegio público es excluida de las clases porque usa una prenda asociada con sus creencias religiosas. El colegio no demuestra que la prenda afecte la seguridad ni los derechos de otras personas. La familia solicita el reintegro inmediato, pero la institución se niega. Mientras continúa la exclusión, la estudiante pierde actividades académicas y evaluaciones.","g":null,"q":"¿Qué mecanismo resulta más adecuado para solicitar la protección judicial inmediata de los derechos fundamentales afectados?","o":["Una acción popular para defender el patrimonio colectivo del colegio.","Una acción de tutela para proteger sus derechos a la educación y a la libertad religiosa.","Un referendo para modificar las reglas de todos los colegios del municipio.","Una acción de cumplimiento para obtener una indemnización por las clases perdidas."],"k":1,"e":"La tutela permite solicitar protección inmediata de derechos fundamentales cuando se cumplen sus condiciones de procedencia. La acción popular protege derechos colectivos, mientras que el referendo es un mecanismo de participación política. La acción de cumplimiento busca hacer efectivo un deber contenido en una norma o acto administrativo, no obtener una indemnización."},{"c":"Los habitantes de un barrio observan que una obra de alcantarillado lleva varios meses suspendida. Una vecina quiere conocer el presupuesto asignado, el estado del contrato y las razones de la suspensión. Su objetivo inicial no es demandar ni convocar una votación, sino obtener información oficial y una respuesta de la alcaldía sobre el manejo de los recursos públicos.","g":null,"q":"¿Cuál es el mecanismo más apropiado para atender el objetivo inicial de la vecina?","o":["La revocatoria del mandato del alcalde.","La acción de grupo para reclamar perjuicios económicos.","El derecho de petición dirigido a la alcaldía.","El plebiscito sobre la continuidad de la obra."],"k":2,"e":"El derecho de petición permite solicitar información y obtener una respuesta oportuna y de fondo de las autoridades, conforme a las reglas aplicables. La revocatoria y el plebiscito persiguen decisiones políticas, no la entrega directa de información. La acción de grupo busca reparar perjuicios sufridos por un conjunto de personas."},{"c":"Un grupo de ciudadanos considera que el alcalde ha incumplido compromisos centrales de su programa de gobierno. Por ello, quiere promover un procedimiento para que los electores decidan si debe terminar anticipadamente su periodo. Los promotores saben que no basta con expresar inconformidad y que deben cumplir requisitos legales de tiempo, apoyos y votación.","g":null,"q":"¿Qué mecanismo de participación corresponde a la iniciativa descrita?","o":["La revocatoria del mandato.","El cabildo abierto.","La iniciativa popular legislativa.","El referendo derogatorio."],"k":0,"e":"La revocatoria del mandato permite que la ciudadanía decida sobre la terminación anticipada del mandato de alcaldes o gobernadores, bajo requisitos legales. El cabildo abierto sirve para discutir asuntos de interés comunitario. La iniciativa popular propone normas y el referendo derogatorio busca retirar una norma del ordenamiento, no finalizar el mandato del alcalde."},{"c":"Durante un debate, un funcionario afirma que el presidente debería poder expedir cualquier ley, resolver definitivamente los conflictos judiciales y evitar el control de otras instituciones. Otra participante responde que la organización constitucional distribuye funciones entre distintas ramas y establece controles para impedir que una sola autoridad concentre todas las decisiones del Estado.","g":null,"q":"¿Cuál argumento respalda mejor la respuesta de la participante?","o":["Las ramas del poder deben actuar sin ninguna relación entre ellas.","La elección popular autoriza al presidente a reemplazar a los jueces.","El Congreso debe dirigir todas las decisiones administrativas y judiciales.","La separación de poderes limita la concentración de autoridad mediante funciones diferenciadas y controles."],"k":3,"e":"La separación de poderes distribuye funciones y permite controles que reducen el riesgo de arbitrariedad. No significa aislamiento absoluto, pues las ramas también colaboran armónicamente. Ni la elección presidencial permite reemplazar a los jueces ni el Congreso reúne todas las funciones estatales."},{"c":"Una alcaldía ofrece un trámite esencial únicamente por internet. En algunas veredas no hay conectividad y muchas personas mayores no cuentan con habilidades digitales. Aunque la plataforma admite a todos los ciudadanos bajo las mismas reglas, numerosos habitantes no logran usarla. Una organización propone mantener la plataforma y habilitar atención presencial y jornadas móviles en las veredas.","g":null,"q":"¿Por qué la propuesta es coherente con el principio de igualdad en un Estado social de derecho?","o":["Porque la igualdad exige que toda persona utilice exactamente el mismo canal.","Porque los servicios públicos pueden reservarse a quienes tienen conexión.","Porque busca remover barreras que impiden el acceso efectivo de algunos grupos.","Porque permite eliminar los requisitos legales para todos los trámites rurales."],"k":2,"e":"La igualdad material exige considerar barreras reales y adoptar medidas que faciliten el ejercicio efectivo de los derechos. Usar un único canal puede mantener exclusiones aunque la regla parezca igual para todos. La propuesta no reserva el servicio a un grupo ni elimina los requisitos legales del trámite."},{"c":"En una discusión sobre la independencia de la Nueva Granada, una estudiante destaca la crisis de la monarquía española tras la invasión napoleónica. Otro señala las tensiones de los criollos frente al acceso a cargos y las restricciones coloniales. Un tercer estudiante menciona las movilizaciones locales y la circulación de ideas sobre soberanía y representación política.","g":null,"q":"¿Cuál interpretación integra mejor los factores mencionados?","o":["La independencia fue causada exclusivamente por la invasión napoleónica.","La independencia surgió de la interacción entre crisis externas, tensiones coloniales y acciones locales.","Las ideas políticas reemplazaron por completo los intereses sociales y económicos.","Las movilizaciones locales ocurrieron sin relación con la situación de la monarquía."],"k":1,"e":"La interpretación multicausal relaciona condiciones externas con tensiones y actuaciones dentro del territorio colonial. Los factores mencionados no permiten atribuir el proceso a una causa exclusiva. Tampoco justifican separar completamente las ideas, los intereses y las movilizaciones."},{"c":"En una clase se comparan dos formas de organización territorial de Colombia. El orden constitucional de 1863 otorgó amplia autonomía a los estados federales. La Constitución de 1886 estableció una república unitaria y reforzó la autoridad del gobierno nacional. El ejercicio pide identificar el cambio institucional principal, sin suponer que todas las diferencias regionales desaparecieron.","g":null,"q":"¿Qué transformación política expresa mejor este cambio constitucional?","o":["El reemplazo de la república por una monarquía hereditaria.","La eliminación de cualquier autoridad en los departamentos.","El traslado de todas las funciones nacionales a gobiernos autónomos.","El paso de una organización federal a una organización unitaria con mayor centralización."],"k":3,"e":"El cambio principal fue el tránsito del federalismo a una república unitaria con mayor centralización política. Esto no convirtió al país en una monarquía ni eliminó toda autoridad territorial. La transferencia de todas las funciones nacionales a gobiernos autónomos describe una dirección contraria al cambio señalado."},{"c":"Durante el Frente Nacional, liberales y conservadores acordaron alternarse la Presidencia y distribuir entre ambos partidos numerosos cargos públicos. El pacto buscaba reducir la confrontación bipartidista y estabilizar las instituciones. Sin embargo, sectores que no pertenecían a esos partidos cuestionaron las restricciones que el acuerdo imponía a su acceso al poder y a la competencia política.","g":null,"q":"¿Cuál balance reconoce tanto un propósito del acuerdo como una de sus limitaciones?","o":["Buscó disminuir la confrontación bipartidista, pero restringió la competencia de fuerzas ajenas al pacto.","Eliminó todas las diferencias ideológicas y garantizó representación idéntica a cualquier movimiento.","Suprimió las elecciones y entregó permanentemente la Presidencia a un solo partido.","Amplió sin restricciones el acceso de todos los partidos a los cargos pactados."],"k":0,"e":"El acuerdo pretendía superar la confrontación entre liberales y conservadores, pero su distribución del poder limitó la competencia de otras fuerzas. No eliminó las diferencias ideológicas ni aseguró acceso igualitario a todos los movimientos. Tampoco suprimió las elecciones o asignó permanentemente la Presidencia a un único partido."},{"c":"Después de un acuerdo de paz, una comunidad solicita conocer qué ocurrió con sus familiares desaparecidos, recibir reparación y evitar nuevas agresiones. Algunas víctimas también piden que se determinen responsabilidades. Una autoridad propone limitar la respuesta a entregar ayudas económicas, sin investigar los hechos ni modificar las condiciones que permitieron la violencia.","g":null,"q":"¿Cuál alternativa responde de manera más integral a las necesidades de las víctimas?","o":["Entregar subsidios y cerrar toda investigación para acelerar la reconciliación.","Concentrarse únicamente en castigos, sin escuchar las solicitudes de las víctimas.","Articular verdad, justicia, reparación y garantías de no repetición.","Declarar que un acuerdo de paz elimina automáticamente los derechos de las víctimas."],"k":2,"e":"Una respuesta integral combina esclarecimiento, determinación de responsabilidades, reparación y medidas para prevenir nuevos hechos. Las ayudas económicas pueden formar parte de la reparación, pero no sustituyen los demás componentes. La justicia aislada tampoco satisface todas las necesidades, y un acuerdo de paz no extingue los derechos de las víctimas."},{"c":"En un conflicto armado, una unidad identifica una instalación utilizada exclusivamente para comunicaciones militares. Cerca se encuentra un centro de salud que atiende a la población civil y no se usa para operaciones militares. Un comandante propone atacar ambos lugares para debilitar la moral de los habitantes y obligarlos a abandonar la zona.","g":null,"q":"¿Qué principio del derecho internacional humanitario contradice directamente la propuesta de atacar el centro de salud?","o":["La soberanía permite atacar cualquier instalación dentro del territorio nacional.","La distinción exige diferenciar entre objetivos militares y personas o bienes civiles protegidos.","La reciprocidad autoriza atacar civiles cuando el adversario incumple las normas.","La necesidad militar convierte automáticamente todos los servicios públicos en objetivos militares."],"k":1,"e":"El principio de distinción prohíbe dirigir ataques contra civiles y bienes civiles, y los centros de salud cuentan además con protección específica. Una finalidad de intimidación no convierte el centro descrito en objetivo militar. La soberanía, la reciprocidad y la necesidad militar no autorizan ataques indiscriminados ni eliminan esas protecciones."},{"c":"En 1914, el asesinato del heredero del Imperio austrohúngaro desencadenó una crisis diplomática. Sin embargo, Europa ya estaba atravesada por rivalidades imperiales, nacionalismos, competencia armamentista y alianzas militares. En una actividad escolar, se pide distinguir entre el acontecimiento que precipitó la Primera Guerra Mundial y las condiciones que facilitaron su expansión.","g":null,"q":"¿Cuál afirmación establece correctamente esa distinción?","o":["El asesinato fue un detonante, mientras las rivalidades y alianzas contribuyeron a transformar la crisis en una guerra amplia.","El asesinato explica por sí solo toda la guerra y hace innecesario estudiar el contexto.","Las alianzas surgieron después de terminar la guerra y no influyeron en su expansión.","La competencia armamentista garantizaba que cualquier crisis se resolviera pacíficamente."],"k":0,"e":"Un detonante precipita un proceso, pero su alcance depende de condiciones previas como las rivalidades y las alianzas. Por eso, el asesinato no basta como explicación única. Las alianzas existían antes del conflicto y la competencia armamentista no garantizaba una solución pacífica."},{"c":"Durante la Guerra Fría, Estados Unidos y la Unión Soviética compitieron por influencia internacional, desarrollaron arsenales nucleares y respaldaron a distintos actores en conflictos regionales. Aunque no sostuvieron una guerra directa de gran escala entre sí, hubo enfrentamientos armados en otros territorios. Un estudiante concluye que el término «fría» significa que no existió violencia.","g":null,"q":"¿Qué evidencia del contexto permite corregir la conclusión del estudiante?","o":["La competencia internacional desapareció durante todo el periodo.","Los arsenales nucleares impidieron cualquier conflicto regional.","Las dos potencias compartían un único sistema político y económico.","Hubo guerras regionales vinculadas con la rivalidad, aunque las superpotencias evitaron un enfrentamiento directo de gran escala."],"k":3,"e":"La expresión Guerra Fría no indica ausencia de violencia, sino una rivalidad que evitó una guerra directa de gran escala entre las superpotencias. Los conflictos regionales muestran que esa rivalidad tuvo consecuencias armadas. Las otras opciones niegan la competencia o atribuyen a las armas nucleares una capacidad de impedir todas las guerras que el contexto contradice."},{"c":"En un mercado local de papa, una temporada de lluvias destruye parte de la cosecha. Los productores pueden llevar menos cantidad al mercado a cada precio. Para este ejercicio, se supone que la demanda de los consumidores y las demás condiciones permanecen iguales, que los precios pueden ajustarse y que no llegan suministros adicionales de otras regiones.","g":null,"q":"Según el modelo básico de oferta y demanda, ¿qué resultado es más probable?","o":["Un menor precio de equilibrio y una mayor cantidad vendida.","El mismo precio y la misma cantidad, porque la demanda no cambió.","Un mayor precio de equilibrio y una menor cantidad vendida.","Una mayor cantidad ofrecida a todos los precios por efecto de las pérdidas."],"k":2,"e":"La pérdida de cosecha reduce la oferta y, con demanda constante, tiende a elevar el precio de equilibrio y disminuir la cantidad intercambiada. La ausencia de cambios en la demanda no impide que un cambio en la oferta altere el equilibrio. Las otras opciones describen efectos contrarios a la reducción de la oferta."},{"c":"En una economía hipotética, el precio de los tomates sube durante un mes por una dificultad temporal de transporte. Al mismo tiempo, un indicador que resume los precios de una amplia canasta de consumo registra aumentos persistentes durante varios meses. Una periodista debe diferenciar el encarecimiento de un producto de un proceso inflacionario general.","g":null,"q":"¿Cuál interpretación es económicamente más adecuada?","o":["El aumento persistente del nivel general de precios indica inflación; el alza del tomate, por sí sola, no permite establecerla.","Cualquier subida de un solo producto demuestra que todos los precios aumentaron.","La inflación ocurre únicamente cuando todos los productos suben exactamente al mismo ritmo.","Una dificultad de transporte impide que exista cualquier cambio en el nivel general de precios."],"k":0,"e":"La inflación se refiere al aumento sostenido del nivel general de precios, no simplemente al encarecimiento aislado de un bien. No requiere que todos los productos aumenten en idéntica proporción. Una dificultad de transporte puede afectar precios, pero no permite negar ni demostrar por sí sola un proceso general."},{"c":"Para un ejercicio, se supone que una familia destina todo su ingreso mensual a una canasta de bienes. El año pasado recibía 1.000.000 de pesos y cada canasta costaba 100.000 pesos. Este año su ingreso aumenta a 1.050.000 pesos, pero la misma canasta cuesta 110.000 pesos. La composición y la calidad de la canasta no cambian.","g":null,"q":"¿Qué ocurre con el poder adquisitivo de la familia?","o":["Aumenta, porque cualquier incremento del ingreso permite comprar más bienes.","Disminuye, pues pasa de poder comprar 10 canastas a aproximadamente 9,55.","Permanece igual, porque ingreso y precio aumentaron en la misma proporción.","Se duplica, porque ahora recibe 50.000 pesos adicionales."],"k":1,"e":"Antes podía comprar 1.000.000 ÷ 100.000 = 10 canastas; ahora puede comprar 1.050.000 ÷ 110.000 ≈ 9,55. El ingreso aumentó 5 %, mientras el precio de la canasta aumentó 10 %, por lo que el poder adquisitivo cayó. Las demás opciones confunden el aumento nominal del ingreso con una mejora real o usan proporciones incorrectas."},{"c":"Un investigador estudia una protesta laboral del pasado. Dispone de un comunicado empresarial que afirma que la producción se detuvo por «agitadores externos» y de una carta de trabajadores que denuncia jornadas excesivas y salarios atrasados. Ambos documentos fueron escritos durante el conflicto y por actores directamente interesados en su desenlace.","g":null,"q":"¿Cuál procedimiento permite analizar estas fuentes con mayor rigor?","o":["Aceptar el comunicado empresarial porque una organización formal siempre es imparcial.","Descartar la carta porque los testimonios de participantes nunca aportan información.","Elegir la versión que coincida con las creencias personales del investigador.","Examinar autoría, propósito y contexto de ambas fuentes y contrastarlas con otras evidencias."],"k":3,"e":"El análisis crítico reconoce que cada fuente tiene una posición y un propósito, sin asumir que por ello carece de valor. Contrastar documentos con otras evidencias ayuda a identificar coincidencias, diferencias y límites. La formalidad institucional, la participación directa o la afinidad personal no garantizan veracidad."},{"c":"En una cuenca colombiana, varios municipios ubicados aguas arriba vierten residuos al río. Un municipio aguas abajo utiliza esa agua para abastecer a sus habitantes y reporta mayores costos de tratamiento. Aunque cada alcaldía administra su territorio, la corriente atraviesa sus límites y transporta sustancias desde unos municipios hacia otros.","g":null,"q":"¿Qué estrategia responde mejor a la naturaleza territorial del problema?","o":["Tratar el río como varios sistemas independientes que terminan en cada límite municipal.","Coordinar la gestión de la cuenca entre municipios y autoridades ambientales, con prevención y seguimiento de los vertimientos.","Trasladar toda la responsabilidad al municipio aguas abajo por utilizar el agua.","Suspender el monitoreo para evitar desacuerdos entre las administraciones."],"k":1,"e":"Una cuenca conecta territorios mediante el flujo del agua, por lo que requiere coordinación y acciones sobre las fuentes de contaminación. Los límites administrativos no detienen los contaminantes. Culpar exclusivamente al municipio afectado o eliminar el monitoreo impide abordar las causas compartidas."},{"c":"Un municipio planea construir viviendas en una llanura junto a un río. Los registros locales indican que el sector se inunda periódicamente durante lluvias intensas. La propuesta incluye ampliar una carretera para facilitar el acceso, pero no evalúa el riesgo de inundación. Varias familias necesitan vivienda y solicitan una solución segura y accesible.","g":null,"q":"¿Qué decisión incorpora mejor la gestión del riesgo en el ordenamiento territorial?","o":["Autorizar la construcción porque una carretera elimina el riesgo de inundación.","Ignorar los registros históricos si el terreno tiene un precio bajo.","Evaluar la amenaza y la vulnerabilidad antes de decidir, y priorizar ubicaciones seguras o medidas técnicamente viables.","Prohibir cualquier vivienda en todo el municipio, sin estudiar diferencias entre sectores."],"k":2,"e":"La gestión del riesgo exige valorar las amenazas y las condiciones de exposición y vulnerabilidad antes de ocupar un territorio. Una carretera no elimina por sí misma las inundaciones y un precio bajo no garantiza seguridad. Tampoco se justifica extender una prohibición a todo el municipio sin una evaluación diferenciada."},{"c":"Una empresa colombiana empieza a exportar prendas gracias a una plataforma internacional. A la vez, enfrenta competencia de productos importados más baratos. Algunos trabajadores consideran que el acceso a nuevos compradores puede generar empleo, mientras otros temen que la presión por reducir costos deteriore sus condiciones laborales. El resultado dependerá también de decisiones empresariales y políticas públicas.","g":null,"q":"¿Cuál conclusión reconoce mejor los efectos posibles de la globalización en este caso?","o":["Puede ampliar mercados y aumentar la competencia, con beneficios y riesgos que deben evaluarse y gestionarse.","Garantiza automáticamente mejores salarios para todos los trabajadores.","Impide que cualquier empresa nacional venda productos en el exterior.","Produce exactamente los mismos efectos en todos los sectores y territorios."],"k":0,"e":"La integración internacional puede abrir oportunidades comerciales y generar presiones competitivas con efectos diversos. Por eso, sus resultados no son automáticos ni uniformes. Las otras opciones niegan la exportación descrita o aseguran beneficios y efectos idénticos sin sustento."},{"c":"En un colegio, varios estudiantes difunden mensajes humillantes sobre una compañera en un grupo digital. Ella informa que siente miedo de asistir a clase. Un docente propone escucharla, detener la difusión, activar la ruta de atención correspondiente y trabajar con los involucrados para reconocer el daño, asumir responsabilidades y prevenir nuevas agresiones.","g":null,"q":"¿Qué valoración de la propuesta es más adecuada desde la convivencia escolar?","o":["Es innecesaria, porque los mensajes digitales nunca afectan la vida escolar.","Debe sustituirse por una exposición pública de la estudiante afectada para aclarar lo ocurrido.","Solo es válida si obliga a la estudiante a reconciliarse inmediatamente con quienes la agredieron.","Combina protección, atención institucional y responsabilidad, sin reducir la situación a un castigo aislado."],"k":3,"e":"La propuesta atiende la seguridad de la estudiante y promueve responsabilidades y prevención mediante la ruta institucional. Las agresiones digitales pueden afectar directamente la convivencia escolar. Exponer a la víctima o imponer una reconciliación puede agravar el daño y no respeta su participación ni su bienestar."},{"c":"Durante una campaña municipal, una candidata presenta propuestas de transporte y explica cómo piensa financiarlas. Otro candidato ofrece entregar mercados únicamente a quienes demuestren haber votado por él. Un grupo ciudadano discute cuál de estas prácticas permite una elección libre y cuál puede convertir una necesidad económica en un instrumento de presión electoral.","g":null,"q":"¿Por qué la oferta condicionada de mercados afecta la libertad del voto?","o":["Porque toda propuesta que mencione recursos económicos constituye compra de votos.","Porque los ciudadanos con necesidades económicas no tienen derecho a participar.","Porque condiciona un beneficio particular al apoyo electoral y puede coaccionar la decisión del votante.","Porque comparar programas de gobierno impide que exista competencia electoral."],"k":2,"e":"Condicionar la entrega de un beneficio al voto transforma la ayuda en una forma de presión o compra del apoyo electoral. Esto es distinto de presentar propuestas públicas y discutir su financiación. La condición económica no elimina derechos políticos, y comparar programas favorece una decisión informada."},{"c":"Se proyecta una obra que atravesaría el territorio de una comunidad étnica y afectaría directamente sus prácticas culturales y el uso de sus recursos. La entidad responsable anuncia una reunión cuando las decisiones principales ya están tomadas y afirma que bastará con informar el calendario de construcción. La comunidad solicita participar antes de que se definan las medidas que la afectan.","g":null,"q":"¿Qué actuación responde mejor al derecho de la comunidad en la situación descrita?","o":["Realizar una consulta previa de buena fe, culturalmente adecuada y orientada a alcanzar acuerdos sobre las medidas que la afectan directamente.","Sustituir la participación de la comunidad por una encuesta exclusiva a habitantes de la capital.","Considerar que comunicar una decisión definitiva equivale siempre a consultar.","Excluir a la comunidad del proceso porque la obra fue propuesta por una entidad pública."],"k":0,"e":"La consulta previa protege la participación de comunidades étnicas frente a medidas que las afectan directamente y no se reduce a una notificación posterior. Debe desarrollarse de buena fe y mediante procedimientos adecuados a la comunidad. Una encuesta a otras personas o el origen público del proyecto no reemplazan ni anulan este derecho."},{"c":"Un grupo de migrantes llega a una ciudad colombiana. Algunos carecen de documentación regular y enfrentan amenazas y agresiones. En una reunión vecinal, una persona afirma que solo quienes tienen ciudadanía colombiana poseen derechos humanos. Otra distingue entre los derechos inherentes a toda persona y ciertos derechos políticos cuyo ejercicio depende de requisitos legales específicos.","g":null,"q":"¿Cuál afirmación sustenta correctamente la segunda posición?","o":["La falta de documentación permite privar a cualquier persona de su integridad física.
