","Los derechos humanos corresponden a todas las personas, aunque algunos derechos políticos tengan condiciones particulares.","La ciudadanía es requisito indispensable para recibir protección frente a la tortura.","Todos los derechos políticos se ejercen sin ninguna condición de nacionalidad, edad o residencia."],"k":1,"e":"Los derechos humanos son inherentes a la persona y no desaparecen por su nacionalidad o situación migratoria. Esto es compatible con requisitos específicos para ejercer ciertos derechos políticos. Las otras opciones autorizan vulneraciones graves o confunden la universalidad de los derechos humanos con la ausencia de reglas para toda participación política."},{"c":"Una alcaldía propone trasladar a familias desplazadas desde un alojamiento temporal hacia viviendas permanentes en la periferia. Las familias valoran la estabilidad habitacional, pero señalan que el nuevo lugar queda lejos de sus empleos y escuelas. La alcaldía destaca que allí hay suelo disponible y costos menores. Ambas partes buscan una solución, aunque priorizan aspectos diferentes.","g":null,"q":"¿Cuál propuesta integra mejor las perspectivas expuestas?","o":["Elegir solo el terreno más barato, pues el acceso al trabajo no forma parte del problema.","Mantener indefinidamente el alojamiento temporal sin evaluar alternativas.","Suponer que la oposición al lugar implica que las familias rechazan cualquier vivienda permanente.","Comparar opciones con participación de las familias, considerando vivienda, costos, transporte, empleo y acceso a servicios."],"k":3,"e":"La propuesta integra las restricciones presupuestales con las necesidades de quienes habitarán las viviendas. El traslado debe evaluarse por sus efectos sobre la vida cotidiana, no solo por el costo del suelo. Las demás opciones ignoran dimensiones relevantes, renuncian a buscar soluciones o atribuyen a las familias una posición que no expresaron."},{"c":"En una elección escolar hipotética hay 1.000 estudiantes habilitados para votar. Participan 600: la propuesta A recibe 330 votos y la propuesta B recibe 270. No hay votos en blanco ni anulados. El comité anuncia que A obtuvo el 55 % de los votos emitidos. Un vocero afirma que, por ello, A recibió el apoyo de la mayoría de todos los estudiantes habilitados.","g":null,"q":"¿Cuál evaluación de la afirmación del vocero es correcta?","o":["Confunde dos grupos de referencia: A obtuvo el 55 % de los votos emitidos, pero el 33 % de los estudiantes habilitados.","Es correcta, porque 330 votos representan más de la mitad de 1.000 estudiantes.","Es incorrecta, porque A obtuvo únicamente el 27 % de los votos emitidos.","Es correcta, porque quienes no votaron deben contarse automáticamente como partidarios de A."],"k":0,"e":"Los 330 votos equivalen al 55 % de los 600 emitidos y al 33 % de los 1.000 estudiantes habilitados. Ganar entre quienes votaron no demuestra apoyo mayoritario de todo el electorado. Las demás opciones calculan mal los porcentajes o asignan sin evidencia una preferencia a quienes se abstuvieron."}]};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gfx(g){try{if(!g||!g.t)return"";
if(g.t==="table")return`<div class="wrap"><table><tr>${g.h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${g.r.map(r=>`<tr>${r.map((x,k)=>k?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join("")}</tr>`).join("")}</table></div>`;
const v=g.v.map(Number),n=v.length,m=Math.max(...v)||1,W=300/n;if(n<2||n!==g.l.length)return"";
let s=`<svg viewBox="0 0 340 180" role="img" aria-label="${esc(g.title||"Gráfica")}"><text x="170" y="14" text-anchor="middle" style="font-weight:700">${esc(g.title||"")}</text><line x1="30" y1="140" x2="330" y2="140" stroke="currentColor"/>`;
if(g.t==="bar")v.forEach((x,k)=>{const h=x/m*100,px=30+k*W+W*.15;s+=`<rect x="${px}" y="${140-h}" width="${W*.7}" height="${h}" rx="3" style="fill:var(--bar)"/><text x="${px+W*.35}" y="${134-h}" text-anchor="middle">${x}</text><text x="${px+W*.35}" y="156" text-anchor="middle">${esc(g.l[k])}</text>`});
else{const P=v.map((x,k)=>[40+k*(280/(n-1)),140-x/m*100]);s+=`<polyline fill="none" stroke-width="3" points="${P.map(p=>p.join(",")).join(" ")}" style="stroke:var(--bar)"/>`+P.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" style="fill:var(--bar)"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle">${v[k]}</text><text x="${p[0]}" y="156" text-anchor="middle">${esc(g.l[k])}</text>`).join("")}
return s+"</svg>"}catch(e){return""}}
function home(){S=null;app.innerHTML=`<h1>Banco Saber 11</h1><p class="sub">Elige un área y resuelve 25 preguntas con contexto y explicación de cada opción. El banco está incluido en esta página, así que puedes practicar sin iniciar sesión ni depender de servicios externos. Si una respuesta te parece dudosa, verifícala en la <a href="https://www.icfes.gov.co/caja-de-herramientas-saber-11/" target="_blank" rel="noopener">Caja de Herramientas del ICFES</a>.</p><div class="grid">${AREAS.map((a,i)=>`<button class="ac" data-i="${i}"><b>${a.n}</b><span>${N} preguntas</span></button>`).join("")}</div>`;
app.querySelectorAll(".ac").forEach(b=>b.onclick=()=>start(AREAS[+b.dataset.i]))}
function load(t){app.innerHTML=`<div class="load" aria-live="polite">${t}</div>`}
function start(a){const bank=BANK[a.n]||[];S={a,qs:shuf(bank).slice(0,N),idx:0,ans:[],batches:N/B,loading:false,err:null};show()}
function adv(){if(!S)return;S.idx<S.qs.length?show():end()}
const total=()=>N,good=()=>S.ans.filter((a,k)=>a===S.qs[k].k).length;
function show(){const q=S.qs[S.idx],T=N;
app.innerHTML=`<div class="meta"><span>${S.a.n} · ${S.idx+1} de ${T}</span><span>${good()} correctas</span></div><div class="bar"><i style="width:${S.idx/T*100}%"></i></div><div class="card"><div class="ctx">${esc(q.c)}</div>${gfx(q.g)}<p class="q">${esc(q.q)}</p>${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}.</b><span>${esc(o)}</span></button>`).join("")}<div id="fb" aria-live="polite"></div></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function pick(k){const q=S.qs[S.idx],g=k===q.k;S.ans[S.idx]=k;
app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.k)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
const last=S.idx>=N-1;document.getElementById("fb").innerHTML=`<div class="fb ${g?"ok":"bad"}"><strong>${g?"¡Correcto!":"Incorrecto. La respuesta es "+L[q.k]+"."}</strong><p>${esc(q.e)}</p></div><button class="btn" id="nx">${last?"Ver resultados":"Siguiente"}</button>`;
const n=document.getElementById("nx");n.focus();n.onclick=()=>{S.idx++;adv()}}
function end(){const t=S.ans.length,g=good(),miss=S.qs.map((q,k)=>[q,k]).filter(([q,k])=>S.ans[k]!==undefined&&S.ans[k]!==q.k);const a=S.a;
app.innerHTML=`<h1>${a.n}: resultados</h1><div class="card"><div class="big">${g}/${t} · ${t?Math.round(g/t*100):0} %</div></div><div class="card"><h2 style="margin:0 0 6px;font-size:1.2rem">${miss.length?"Repasa lo que fallaste":"¡Sin errores!"}</h2>${miss.map(([q,k])=>`<div class="rev"><b>${k+1}. ${esc(q.q)}</b><br>Tu respuesta: ${L[S.ans[k]]}. Correcta: ${L[q.k]}. ${esc(q.o[q.k])}<br><span class="sub">${esc(q.e)}</span></div>`).join("")}</div><button class="btn" id="again">Otra tanda de ${N}</button><button class="btn alt" id="hm">Elegir otra área</button>`;
document.getElementById("again").onclick=()=>start(a);document.getElementById("hm").onclick=home}
home();
</script></body></html>
