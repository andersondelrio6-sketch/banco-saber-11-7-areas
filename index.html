{n:"Lectura crítica",t:["idea principal","inferencia a partir de pistas","falacias (ad hominem, falsa causa, generalización)","función de un párrafo o conector","hecho vs. opinión","texto discontinuo (infografía, aviso, tabla)","intención comunicativa","vocabulario según el contexto","comparar dos posturas","ironía o sátira","voz del narrador en un texto literario","fortalecer o debilitar un argumento","tesis y argumentos de un texto filosófico corto","caricatura o cómic con texto"]},
{n:"Matemáticas",t:["porcentajes y descuentos","proporcionalidad y regla de tres","media, mediana y moda con tabla","lectura de gráficas de barras o líneas","probabilidad simple y compuesta","ecuaciones y problemas con enunciado","función lineal (pendiente, intercepto)","áreas y volúmenes","teorema de Pitágoras","combinatoria","sucesiones","interés simple y compuesto","función cuadrática","razones y escalas"]},
{n:"Biología",t:["célula y organelos","fotosíntesis y respiración celular","genética mendeliana y cuadro de Punnett","cadenas tróficas y flujo de energía","evolución y selección natural","sistemas del cuerpo humano","diseño experimental (variables)","ADN, ARN y síntesis de proteínas","relaciones entre especies","ciclos biogeoquímicos","mitosis y meiosis","biotecnología y ética"]},
{n:"Química",t:["mezclas y métodos de separación","tabla periódica y propiedades","enlaces químicos","balanceo de ecuaciones","estequiometría y moles","ácidos, bases y pH","soluciones y concentración","gases y sus leyes","química orgánica básica","cambios de estado y gráficas de calentamiento","oxidación y reducción","densidad y propiedades de la materia"]},
{n:"Física",t:["cinemática y gráficas de movimiento","leyes de Newton","energía cinética y potencial","trabajo y potencia","circuitos y ley de Ohm","ondas y sonido","calor y temperatura","presión y fluidos","óptica: reflexión y refracción","gravitación","caída libre","conservación del momento"]},
{n:"Inglés",t:["public signs and notices","short conversations (best reply)","verb tenses","vocabulary in context","reading comprehension of a short text","prepositions","conditionals","cloze text (choose the missing word)","email or message purpose","comparatives and superlatives","modal verbs","pronouns and quantifiers"]},
{n:"Sociales y ciudadanas",t:["Constitución de 1991 y derechos","mecanismos de participación y protección","ramas del poder público","historia de Colombia (independencia, siglo XX)","conflicto armado y paz","guerras mundiales y Guerra Fría","oferta, demanda e inflación","derechos humanos y DIH","análisis de dos fuentes con perspectivas distintas","geografía y territorio de Colombia","globalización","caso de convivencia escolar o ciudadana"]}
];
const L="ABCD",app=document.getElementById("app"),N=25,B=5;let S=null;
const BANK={"Lectura crítica":[{"c":"En el barrio La Esperanza, la biblioteca dejó de medir su éxito únicamente por el número de préstamos. Ahora también registra los encuentros entre vecinos, los talleres de escritura y las consultas acompañadas por sus funcionarios. Aunque los libros siguen siendo esenciales, la coordinadora sostiene que una biblioteca pública cumple su misión cuando facilita el acceso al conocimiento y crea oportunidades para participar en la vida comunitaria.","g":null,"q":"¿Cuál es la idea principal del texto?","o":["Los préstamos de libros son un indicador que debería desaparecer de las bibliotecas.","La labor de una biblioteca incluye el acceso al conocimiento y la participación comunitaria.","Los talleres de escritura deben convertirse en el servicio principal de toda biblioteca.","La participación de los vecinos dificulta evaluar el funcionamiento de las bibliotecas."],"k":1,"e":"El texto amplía la concepción de biblioteca más allá del préstamo de libros y destaca su función comunitaria. No propone eliminar los préstamos ni dar prioridad absoluta a los talleres. Tampoco afirma que la participación vecinal dificulte la evaluación."},{"c":"Cuando llegó al salón, Lucía encontró las sillas acomodadas en círculo y su carpeta sobre una de ellas. En el tablero todavía se leía: «Cada participante presentará su propuesta». Miró el reloj, guardó las hojas que había preparado y preguntó al profesor si podía entregar su trabajo por escrito. Él respondió: «La discusión terminó hace diez minutos, pero puedo recibirlo».","g":null,"q":"¿Qué puede inferirse con mayor respaldo en el texto?","o":["Lucía decidió abandonar definitivamente la asignatura.","El profesor había prohibido las intervenciones orales.","Lucía llegó después del momento previsto para presentar su propuesta.","Los compañeros rechazaron el contenido del trabajo de Lucía."],"k":2,"e":"La organización del salón, la instrucción del tablero y la respuesta del profesor indican que había una actividad de presentación y discusión que ya había terminado. Esto permite inferir que Lucía llegó tarde a ese momento. No hay información sobre abandono de la asignatura, prohibiciones o rechazo de su propuesta."},{"c":"Durante una reunión escolar, Samuel propuso instalar recipientes para separar los residuos y explicó cómo podrían vaciarse al finalizar cada jornada. Otra participante respondió: «No vale la pena escuchar su propuesta: Samuel perdió dos materias el año pasado». La discusión pasó entonces de la organización de los residuos al desempeño académico del estudiante, sin examinar los costos ni la utilidad de los recipientes.","g":null,"q":"¿Qué falla argumentativa presenta la respuesta de la participante?","o":["Descalifica al proponente mediante un dato personal que no refuta su propuesta.","Supone que separar residuos necesariamente aumentará los gastos escolares.","Presenta la opinión de Samuel como si fuera una decisión de todos los estudiantes.","Repite la propuesta inicial sin ofrecer una razón adicional para aceptarla."],"k":0,"e":"La respuesta ataca una característica del proponente en lugar de evaluar su argumento, por lo que constituye una descalificación personal. El desempeño académico no demuestra que la propuesta sea inconveniente. Las otras opciones describen errores que no aparecen en la intervención."},{"c":"Una tienda cambió el color de su entrada y, durante el mes siguiente, vendió más productos. La administradora concluyó que el nuevo color había causado el aumento. Sin embargo, ese mismo mes la tienda extendió su horario, ofreció descuentos y participó en una feria del barrio. El informe de ventas no separó los efectos de estas medidas ni comparó los resultados con los de otro establecimiento.","g":null,"q":"¿Por qué la conclusión de la administradora está insuficientemente sustentada?","o":["Porque cualquier cambio de color reduce necesariamente las ventas.","Porque las ventas solo pueden explicarse por los descuentos.","Porque un informe comercial nunca permite formular explicaciones.","Porque ocurrieron otros cambios que también podrían explicar el aumento."],"k":3,"e":"El aumento coincidió con varias medidas, por lo que no puede atribuirse únicamente al color de la entrada. La extensión del horario, los descuentos y la feria son explicaciones alternativas. El texto no demuestra que alguna de ellas sea la causa exclusiva ni descarta el valor de los informes comerciales."},{"c":"Un editorial afirma: «Las calles cercanas a las escuelas deben facilitar el desplazamiento a pie, porque muchos estudiantes las recorren diariamente». En el párrafo siguiente reconoce: «Es cierto que algunas familias necesitan llegar en automóvil y que los comercios reciben mercancías». Finalmente propone horarios específicos para las entregas y zonas de descenso, con el fin de proteger a los peatones sin impedir esos usos de la vía.","g":null,"q":"¿Qué función cumple el párrafo que comienza con «Es cierto que»?","o":["Demostrar que la propuesta inicial carece por completo de utilidad.","Reconocer una dificultad que la propuesta posterior intenta atender.","Introducir una narración independiente sobre la vida de las familias.","Sustituir la defensa de los peatones por una defensa exclusiva del automóvil."],"k":1,"e":"El párrafo reconoce necesidades legítimas que podrían objetarse a la propuesta inicial. La solución posterior busca atenderlas sin abandonar la protección de los peatones. Por eso no hay una renuncia a la tesis ni una narración ajena al argumento."},{"c":"El consejo estudiantil solicitó ampliar el horario de la sala de informática. La rectoría reconoció que la medida permitiría terminar trabajos a quienes no tienen computador en casa. Sin embargo, señaló que primero debía garantizarse la presencia de un responsable durante las horas adicionales. Por esa razón, propuso una prueba de dos semanas con acompañamiento docente antes de establecer una ampliación permanente.","g":null,"q":"¿Qué relación introduce el conector «Sin embargo»?","o":["Un contraste entre el beneficio reconocido y una condición pendiente para aplicarlo.","Una consecuencia inevitable de que algunos estudiantes no tengan computador.","Una explicación equivalente a la solicitud presentada por el consejo estudiantil.","Una secuencia temporal entre dos actividades realizadas en la sala."],"k":0,"e":"El conector introduce una reserva frente al beneficio que acaba de reconocerse. La rectoría considera favorable la medida, pero señala una condición necesaria para implementarla. No expresa equivalencia, simple sucesión temporal ni una consecuencia inevitable."},{"c":"En una reseña sobre una obra escolar se leen estas afirmaciones: «La presentación comenzó a las seis de la tarde y participaron doce estudiantes. El vestuario fue el elemento más hermoso de la función. El público ocupó las cuarenta sillas disponibles. Ninguna obra anterior del colegio había resultado tan emocionante». La autora combina información verificable sobre el evento con apreciaciones personales acerca de su calidad.","g":null,"q":"¿Cuál de las siguientes afirmaciones corresponde a un hecho verificable y no a una valoración?","o":["El vestuario fue el elemento más hermoso de la función.","La obra superó en emoción a todas las presentaciones anteriores.","La presentación comenzó a las seis de la tarde.","La función tuvo una calidad artística excepcional."],"k":2,"e":"La hora de inicio puede comprobarse mediante registros o testimonios y no depende de una preferencia estética. Las expresiones sobre belleza, emoción y calidad contienen valoraciones. Que una valoración pueda ser compartida por varias personas no la convierte en un hecho."},{"c":"En la entrada de un humedal aparece este aviso: «Este sendero es también hogar de aves y pequeños animales. Camine únicamente por la ruta señalada, conserve los residuos hasta encontrar un recipiente y evite reproducir música en altavoces. Observar sin alterar el entorno permite que otras personas disfruten este lugar y que sus habitantes continúen usándolo. Gracias por ayudarnos a cuidar este espacio».","g":null,"q":"¿Cuál es la intención comunicativa predominante del aviso?","o":["Relatar la historia de las especies que habitan el humedal.","Promocionar equipos de sonido adecuados para recorridos al aire libre.","Informar que el acceso al humedal está cerrado a los visitantes.","Orientar la conducta de los visitantes para proteger el entorno."],"k":3,"e":"Las instrucciones buscan regular acciones concretas de los visitantes y explican su finalidad ambiental. El aviso no narra una historia, vende productos ni anuncia un cierre. La referencia a los animales sirve para justificar las recomendaciones."},{"c":"La casa de la cultura publica el siguiente aviso: «Taller gratuito de encuadernación. Pueden inscribirse personas de catorce años en adelante. Inscripciones: del lunes al jueves, de nueve de la mañana a cuatro de la tarde. Cupos: veinte, asignados por orden de inscripción. Cada participante debe llevar diez hojas usadas por una sola cara. Las sesiones serán los sábados. No se requiere experiencia previa».","g":null,"q":"¿Cuál de las siguientes personas cumple los requisitos para solicitar un cupo según el aviso?","o":["Una niña de trece años que lleva las hojas y se presenta el lunes a las diez.","Un joven de dieciséis años sin experiencia que lleva las hojas y se presenta el martes a las once.","Una mujer de treinta años que lleva las hojas y se presenta el viernes a las diez.","Un hombre de veinte años que se presenta el miércoles a las cinco de la tarde."],"k":1,"e":"El joven cumple la edad mínima, se presenta dentro del periodo y horario de inscripción y lleva el material solicitado. La falta de experiencia no es un impedimento. Las demás personas incumplen la edad mínima, el día permitido o el horario, y cumplir los requisitos permite solicitar el cupo, no garantiza obtenerlo."},{"c":"Un informe escolar presenta los resultados de una encuesta en la que cada estudiante eligió un solo medio principal para llegar al colegio. En el grupo A, de cuarenta estudiantes, veinticuatro eligieron caminar y dieciséis, autobús. En el grupo B, de sesenta estudiantes, treinta eligieron caminar y treinta, autobús. El informe advierte que estos datos describen únicamente a los dos grupos encuestados.","g":null,"q":"¿Cuál afirmación interpreta correctamente los datos?","o":["En ambos grupos, exactamente la misma proporción de estudiantes eligió caminar.","En el grupo A, menos de la mitad de los estudiantes eligió caminar.","El grupo B tiene más estudiantes que caminan, pero el grupo A tiene una mayor proporción de caminantes.","Los resultados demuestran que caminar es el medio principal de todos los estudiantes de la ciudad."],"k":2,"e":"En el grupo B caminan treinta estudiantes, frente a veinticuatro en el A, pero las proporciones son 50 % y 60 %, respectivamente. Por eso el número absoluto es mayor en B y la proporción es mayor en A. Las demás opciones contradicen los cálculos o generalizan fuera de los grupos estudiados."},{"c":"El colectivo abrió un pequeño periódico barrial con una impresora prestada y aportes voluntarios. Durante los primeros meses, su financiación fue precaria: algunas ediciones debieron aplazarse porque no había dinero para el papel. Aun así, los integrantes mantuvieron el proyecto y buscaron colaboradores permanentes. Su objetivo era dejar de depender de contribuciones ocasionales para publicar con regularidad.","g":null,"q":"En este contexto, ¿qué significa que la financiación fue «precaria»?","o":["Insuficiente e inestable para sostener regularmente la publicación.","Abundante y asegurada durante un periodo prolongado.","Ilegal por provenir exclusivamente de aportes voluntarios.","Innecesaria porque el periódico no requería materiales."],"k":0,"e":"Los aplazamientos por falta de dinero y la dependencia de aportes ocasionales muestran insuficiencia e inestabilidad. Ese es el sentido contextual de «precaria». El texto no atribuye ilegalidad a los aportes ni sugiere que los recursos fueran abundantes o innecesarios."},{"c":"Marta sostiene: «En clase, los celulares deben permanecer guardados, salvo cuando el docente proponga una actividad que los requiera; de otro modo, dispersan la atención». Julián afirma: «Los celulares pueden servir para consultar y producir contenidos, pero su uso debe tener un propósito definido y reglas claras». Ambos participan en una discusión sobre cómo integrar estos dispositivos sin perjudicar el aprendizaje.","g":null,"q":"¿En qué coinciden las dos posturas?","o":["En que cualquier uso del celular impide aprender.","En que los estudiantes deben decidir su uso sin restricciones.","En que los celulares deben reemplazar todos los materiales escolares.","En que el uso del celular en clase necesita una finalidad pedagógica y regulación."],"k":3,"e":"Marta admite el uso cuando una actividad docente lo requiere y Julián exige propósito y reglas. Ambas posturas aceptan un uso condicionado por objetivos educativos. Ninguna propone una prohibición absoluta, libertad sin límites o sustitución de todos los materiales."},{"c":"Después de esperar cuarenta minutos en la oficina, Elena vio un cartel que decía: «Nuestro compromiso es atenderlo sin demoras». Cuando por fin la llamaron, comentó a su hermano: «Qué rapidez; apenas me alcanzó el tiempo para envejecer». El funcionario no escuchó la frase, y Elena entregó los documentos sin formular una queja directa.","g":null,"q":"¿Cómo debe interpretarse la expresión «Qué rapidez»?","o":["Como un elogio literal al cumplimiento del compromiso anunciado.","Como una duda sobre si Elena había llevado los documentos correctos.","Como una crítica irónica a la demora en la atención.","Como una afirmación de que esperar produce un envejecimiento inmediato."],"k":2,"e":"La espera prolongada contradice el elogio aparente, lo que permite reconocer la ironía. La exageración sobre envejecer refuerza la crítica a la lentitud. No hay una duda sobre los documentos ni una afirmación literal sobre el envejecimiento."},{"c":"En una columna ficticia se anuncia el «Premio Municipal a la Promesa Más Durable». El narrador celebra que un proyecto de parque lleve quince años apareciendo en discursos sin ocupar todavía un solo metro de terreno. Añade que construirlo sería una pérdida, pues obligaría a los funcionarios a inventar una promesa nueva. La ceremonia imaginaria termina con una cinta inaugural que nadie se atreve a cortar.","g":null,"q":"¿Cuál es el principal blanco de la sátira?","o":["La repetición de promesas públicas que no se convierten en obras.","La costumbre de visitar parques durante las ceremonias municipales.","La dificultad técnica de cortar una cinta de inauguración.","La existencia de premios destinados a reconocer proyectos terminados."],"k":0,"e":"El premio absurdo y la defensa de no construir el parque ridiculizan las promesas incumplidas. La cinta sin cortar simboliza una inauguración que nunca se concreta. Los elementos ceremoniales sirven a esa crítica y no constituyen por sí mismos su blanco principal."},{"c":"Escuché que alguien cerraba la puerta del patio. Desde mi habitación no podía ver quién era, pero supuse que mi hermana había regresado. Bajé con el libro que me había pedido y encontré a un vecino esperando junto a la mesa. Solo entonces comprendí que mi hermana seguía afuera y que yo había confundido el sonido de la puerta con una señal de su llegada.","g":null,"q":"¿Qué rasgo caracteriza al narrador de este fragmento?","o":["Conoce de antemano los pensamientos de todos los personajes.","Participa en los hechos y cuenta desde un conocimiento limitado.","Observa los sucesos desde fuera sin intervenir en ellos.","Describe únicamente acontecimientos que ocurrirán en el futuro."],"k":1,"e":"El narrador actúa en la historia y reconoce que su primera interpretación fue equivocada. Esto evidencia un conocimiento limitado a sus percepciones y descubrimientos. No es omnisciente, no permanece fuera de los hechos y narra acontecimientos pasados."},{"c":"El periódico escolar debería publicar las correcciones de sus errores en un lugar visible. Una fecha equivocada o un nombre mal escrito pueden afectar la confianza de los lectores, incluso cuando el resto de una noticia es correcto. Reconocer esas fallas no debilita al periódico: muestra que sus responsables consideran más importante informar con precisión que aparentar que nunca se equivocan.","g":null,"q":"¿Cuál es la tesis defendida en el texto?","o":["Toda noticia que contiene un error debe eliminarse de los archivos.","Los lectores desconfían siempre de los periódicos escolares.","Los nombres mal escritos son más graves que las fechas equivocadas.","El periódico escolar debe hacer visibles las correcciones de sus errores."],"k":3,"e":"La primera oración presenta la propuesta que las siguientes justifican mediante la confianza y la precisión informativa. Esa propuesta constituye la tesis. El texto no exige eliminar noticias, no afirma una desconfianza permanente ni compara la gravedad de los dos errores mencionados."},{"c":"Una orientadora propone instalar un punto de préstamo de sombrillas en la salida del colegio. Su argumento es que algunos estudiantes deben esperar a que deje de llover para caminar a casa, por lo que el préstamo podría reducir esas esperas. El consejo escolar pide información adicional antes de decidir si vale la pena destinar recursos a la iniciativa.","g":null,"q":"¿Qué evidencia fortalecería más directamente el argumento de la orientadora?","o":["Un registro de varios días lluviosos muestra que numerosos estudiantes sin sombrilla retrasan su salida y caminarían de inmediato si pudieran pedir una prestada.","Una encuesta revela que el color preferido de los estudiantes para las sombrillas es el azul.","Un catálogo muestra que existen sombrillas con diseños relacionados con distintas asignaturas.","Una entrevista indica que algunos docentes recuerdan con agrado las tardes lluviosas de su infancia."],"k":0,"e":"El registro respalda tanto la existencia del problema como la utilidad prevista del préstamo. Las preferencias de color, los diseños y los recuerdos no muestran que la medida reduzca la espera. Fortalecer un argumento exige aportar evidencia relacionada con la razón que lo sostiene."},{"c":"Un club de lectura cambió las reuniones de la mañana a la tarde y su asistencia pasó de ocho a dieciséis personas. La coordinadora concluyó que el nuevo horario explicaba por sí solo el aumento. Quiere mantenerlo sin revisar otras condiciones, pues considera que la comparación entre los dos meses basta para identificar la causa del cambio.","g":null,"q":"¿Cuál información adicional debilitaría más la conclusión de la coordinadora?","o":["Las reuniones de ambos meses tuvieron una duración de una hora.","La coordinadora anotó la asistencia al terminar cada reunión.","El cambio de horario coincidió con una campaña de invitación y la incorporación de nuevos integrantes.","Los participantes utilizaron el mismo salón antes y después del cambio."],"k":2,"e":"La campaña y la incorporación de integrantes ofrecen causas alternativas del aumento de asistencia. Por ello debilitan la atribución exclusiva al horario. La duración, el registro de asistencia y el uso del mismo salón no introducen una explicación alternativa comparable."},{"c":"Andrés visitó una panadería nueva y recibió un pan quemado. Al salir, escribió en el grupo del barrio: «Todos los productos de ese lugar son malos; ninguna persona debería comprar allí». No había probado otros productos ni preguntado si lo ocurrido era habitual. Su mensaje convirtió una experiencia particular en una afirmación sobre toda la oferta del negocio.","g":null,"q":"¿Cuál es el problema central del razonamiento de Andrés?","o":["Usa demasiados ejemplos para llegar a una conclusión muy limitada.","Generaliza sobre todos los productos a partir de un único caso.","Confunde una recomendación comercial con una descripción del horario.","Apoya su conclusión en la opinión de especialistas en panadería."],"k":1,"e":"Andrés extiende una observación aislada a todos los productos sin contar con evidencia suficiente. Se trata de una generalización apresurada. No presenta múltiples ejemplos, no habla del horario y no cita especialistas."},{"c":"Una estudiante propone que los trabajos del curso se entreguen exclusivamente por una plataforma digital. Argumenta: «Así nadie tendrá que desplazarse para entregarlos y todos podrán enviarlos desde su casa». El docente le pide revisar si esa solución realmente estaría disponible para la totalidad del grupo antes de eliminar la entrega presencial.","g":null,"q":"¿Qué supuesto necesita el argumento de la estudiante para sostener su afirmación sobre todos los integrantes del curso?","o":["Que los trabajos digitales siempre obtienen mejores calificaciones.","Que el docente prefiere leer documentos impresos.","Que ningún estudiante desea trabajar de manera individual.","Que todos disponen en casa de acceso y medios para usar la plataforma."],"k":3,"e":"La posibilidad de enviar desde casa depende de contar con acceso y medios adecuados para utilizar la plataforma. Sin ese supuesto, la afirmación sobre todo el grupo no se sostiene. Las calificaciones, las preferencias de lectura y el trabajo individual no garantizan esa disponibilidad."},{"c":"El comité recibió una propuesta para abrir el patio durante el descanso y otra para organizar turnos de uso de la cancha. Esta última requería que cada curso eligiera un representante y aceptara un calendario común. Tras discutir ambas, el comité decidió probar primero la organización por turnos, porque permitiría evaluar si el reparto del espacio disminuía los conflictos.","g":null,"q":"¿A qué se refiere la expresión «Esta última»?","o":["A la propuesta de organizar turnos de uso de la cancha.","A la decisión de evaluar los conflictos después de la prueba.","A la propuesta de abrir el patio durante el descanso.","A la elección del comité encargado de las dos iniciativas."],"k":0,"e":"La expresión retoma la segunda de las dos propuestas mencionadas, es decir, la organización de turnos. La exigencia de representantes y un calendario desarrolla esa propuesta. Las otras opciones remiten a la primera iniciativa o a decisiones que no son el antecedente señalado."},{"c":"Un estudiante sostiene que los debates orales deberían reemplazar todos los ensayos escritos, porque permiten responder preguntas de inmediato. Su compañera replica: «Esa interacción es valiosa, pero escribir también permite revisar las ideas, reorganizarlas y corregir errores antes de presentarlas. Sería mejor combinar ambas actividades según el propósito de cada tarea». La discusión se centra en las posibilidades de dos formas de argumentación.","g":null,"q":"¿Cómo responde la compañera al argumento del estudiante?","o":["Niega que los debates permitan responder preguntas durante su desarrollo.","Acepta una ventaja del debate, pero cuestiona la sustitución total de la escritura.","Afirma que los ensayos deben eliminar cualquier intercambio entre estudiantes.","Evita comparar las actividades y cambia el tema hacia las calificaciones."],"k":1,"e":"La compañera reconoce el valor de la interacción y añade beneficios propios de la escritura. Con ello cuestiona que una actividad deba reemplazar completamente a la otra y propone combinarlas. No niega la ventaja mencionada, no excluye el intercambio ni cambia de tema."},{"c":"En una consulta escolar, cada uno de cincuenta participantes escogió una sola prioridad para mejorar el patio: veinte eligieron más sombra, quince eligieron bebederos, diez eligieron bancas y cinco eligieron pintura. Al comentar los resultados, una vocera dijo: «La sombra recibió más apoyos que cualquier otra opción, pero las otras necesidades reunieron juntas más votos». El comité estudia cómo resumir la consulta sin exagerar sus resultados.","g":null,"q":"¿Cuál resumen es fiel a los datos y al comentario de la vocera?","o":["Más de la mitad de los participantes escogió aumentar la sombra.","Los bebederos y las bancas recibieron juntos menos votos que la pintura.","La sombra fue la opción más elegida, aunque no alcanzó la mayoría absoluta.","Todas las prioridades obtuvieron un número semejante de apoyos."],"k":2,"e":"La sombra obtuvo veinte de cincuenta votos, equivalentes al 40 %, y superó individualmente a cada otra opción. Sin embargo, no obtuvo más de la mitad de los votos, por lo que no alcanzó mayoría absoluta. Las otras respuestas contradicen las cantidades o presentan como semejantes resultados claramente distintos."},{"c":"La administración de un edificio envió este mensaje: «Los residentes pueden usar el salón comunal con invitados los sábados y domingos hasta las ocho de la noche». Dos vecinos discrepan: uno entiende que el límite horario se aplica tanto al sábado como al domingo; otro cree que solo se aplica al domingo. La administración desea reformular el mensaje para expresar claramente el límite en ambos días.","g":null,"q":"¿Cuál reformulación expresa de manera más clara la intención de la administración?","o":["Los residentes pueden usar el salón con invitados el sábado y el domingo mencionado hasta las ocho.","Los residentes pueden usar hasta las ocho el salón del domingo y también el del sábado.","Los residentes pueden usar el salón con invitados los fines de semana en un horario habitual.","Tanto los sábados como los domingos, el uso del salón con invitados debe terminar a las ocho de la noche."],"k":3,"e":"La construcción «Tanto los sábados como los domingos» hace explícito que el mismo límite se aplica a ambos días. Además, precisa que el uso debe terminar a las ocho de la noche. Las otras formulaciones conservan dudas, introducen información extraña o eliminan el límite concreto."},{"c":"Un mensaje que circula entre estudiantes afirma que una nueva técnica permite memorizar cualquier tema en diez minutos. Como respaldo, incluye tres comentarios de personas satisfechas y un enlace para comprar el curso. No explica en qué consiste la técnica, cómo se evaluaron sus resultados ni cuántas personas la probaron sin éxito. El mensaje invita a compartirlo antes de que termine una supuesta oferta.","g":null,"q":"¿Cuál es la evaluación crítica mejor sustentada del mensaje?","o":["La promesa carece de respaldo suficiente, pues presenta testimonios seleccionados y omite cómo se comprobaron los resultados.","La técnica está demostrada porque tres personas afirman haber quedado satisfechas.","La existencia de un precio prueba que la técnica no puede funcionar en ningún caso.","La urgencia de la oferta confirma que el método permite aprender cualquier tema."],"k":0,"e":"Los testimonios no bastan para sustentar una promesa tan amplia, especialmente cuando faltan detalles de evaluación y resultados completos. El interés comercial y la urgencia aconsejan examinar el respaldo, pero no demuestran por sí solos que la técnica sea imposible. Tampoco constituyen evidencia de su eficacia."}],"Matemáticas":[{"c":"Una tienda vende una chaqueta cuyo precio inicial es de $200.000. Durante una promoción aplica un descuento del 20 % sobre ese precio. Después, a quienes pagan con una tarjeta específica les ofrece otro descuento del 10 %, calculado sobre el valor que queda tras aplicar el primer descuento. No existen cargos adicionales.","g":null,"q":"¿Cuánto paga por la chaqueta una persona que recibe ambos descuentos?","o":["$140.000","$160.000","$144.000","$180.000"],"k":2,"e":"Después del primer descuento quedan $200.000 × 0,80 = $160.000; luego se paga $160.000 × 0,90 = $144.000. Los descuentos sucesivos no se suman directamente, por lo que $140.000 no corresponde. Los valores de $160.000 y $180.000 consideran solamente uno de los descuentos."},{"c":"Una empresa calcula que seis trabajadores pueden terminar la pintura de un edificio en doce días. Todos trabajan al mismo ritmo, cumplen jornadas de igual duración y pueden distribuirse las tareas sin interferencias. Antes de iniciar, la empresa decide asignar nueve trabajadores al proyecto, manteniendo exactamente la misma cantidad de trabajo.","g":null,"q":"¿Cuántos días necesitarán los nueve trabajadores para terminar la pintura?","o":["8 días","18 días","9 días","6 días"],"k":0,"e":"El trabajo requiere 6 × 12 = 72 jornadas de un trabajador, así que nueve trabajadores necesitan 72 ÷ 9 = 8 días. La relación es inversamente proporcional: aumentar los trabajadores reduce el tiempo. Las otras opciones no conservan la cantidad total de trabajo."},{"c":"Durante cuatro días, una estudiante registró el número de páginas que leyó diariamente: 12, 15, 18 y 15 páginas. El quinto día leyó 20 páginas. Para evaluar su hábito de lectura, quiere calcular el promedio diario correspondiente a los cinco días, considerando cada día con el mismo peso.","g":null,"q":"¿Cuál es la media de páginas leídas por día durante los cinco días?","o":["15 páginas","17,5 páginas","20 páginas","16 páginas"],"k":3,"e":"La suma de las páginas es 12 + 15 + 18 + 15 + 20 = 80, y la media es 80 ÷ 5 = 16 páginas. La opción de 15 páginas corresponde al promedio de los primeros cuatro días. Las demás opciones no resultan de dividir el total entre los cinco registros."},{"c":"En una jornada deportiva se registraron los tiempos, en minutos, que siete participantes tardaron en completar un recorrido: 8, 11, 13, 15, 19, 24 y 30. La organización busca un valor central que dependa de la posición de los datos ordenados y no de la suma de todos los tiempos.","g":null,"q":"¿Cuál es la mediana de los tiempos registrados?","o":["13 minutos","15 minutos","17 minutos","19 minutos"],"k":1,"e":"Con siete datos ordenados, la mediana ocupa la posición (7 + 1) ÷ 2 = 4. El cuarto tiempo es 15 minutos. Los valores de 13 y 19 minutos ocupan otras posiciones, y 17 minutos no es el dato central."},{"c":"Una biblioteca preguntó a catorce visitantes cuánto tiempo habían esperado para recibir atención. Tres visitantes respondieron 10 minutos, cinco respondieron 15 minutos, cuatro respondieron 20 minutos y dos respondieron 25 minutos. La coordinadora quiere identificar el tiempo de espera que apareció con mayor frecuencia entre las respuestas.","g":null,"q":"¿Cuál es la moda de los tiempos de espera?","o":["Una espera de 10 minutos","Una espera de 20 minutos","Una espera de 15 minutos","Una espera de 25 minutos"],"k":2,"e":"La moda es el valor que más se repite, y 15 minutos aparece en cinco respuestas. Los tiempos de 10, 20 y 25 minutos aparecen tres, cuatro y dos veces, respectivamente. Por eso, ninguno de ellos tiene la frecuencia máxima."},{"c":"Un administrador describe una gráfica de barras sobre las ventas de una cafetería. Las barras representan 120 bebidas el lunes, 150 el martes, 90 el miércoles y 180 el jueves. Para organizar el inventario, desea identificar entre qué días consecutivos se presentó el mayor aumento en el número de bebidas vendidas.","g":null,"q":"¿Entre qué días ocurrió el mayor aumento y de cuánto fue?","o":["Del miércoles al jueves: 90 bebidas","Del lunes al martes: 30 bebidas","Del martes al miércoles: 60 bebidas","Del lunes al jueves: 60 bebidas"],"k":0,"e":"Los cambios entre días consecutivos fueron +30, −60 y +90 bebidas. Por tanto, el mayor aumento ocurrió del miércoles al jueves y fue de 90 bebidas. La tercera opción presenta una disminución como aumento, y la cuarta compara días que no son consecutivos."},{"c":"En una bolsa hay cinco fichas rojas, tres azules y dos verdes. Todas tienen el mismo tamaño y la misma textura, y están mezcladas de manera que cualquiera tiene igual posibilidad de ser extraída. Una persona saca una sola ficha sin mirar y gana un premio si la ficha no es azul.","g":null,"q":"¿Cuál es la probabilidad de que la persona gane el premio?","o":["3/10","1/2","2/10","7/10"],"k":3,"e":"Hay diez fichas en total y siete no son azules: cinco rojas y dos verdes. La probabilidad de ganar es, por tanto, 7/10. Las otras fracciones representan únicamente las fichas azules, rojas o verdes, no el conjunto de resultados favorables."},{"c":"Una caja contiene cuatro tarjetas blancas y dos negras, todas indistinguibles al tacto. Se extraen dos tarjetas al azar, una después de la otra, sin devolver la primera a la caja. Para obtener un beneficio en un juego, las dos tarjetas extraídas deben ser blancas.","g":null,"q":"¿Cuál es la probabilidad de extraer dos tarjetas blancas?","o":["4/9","2/5","2/3","1/3"],"k":1,"e":"La primera tarjeta es blanca con probabilidad 4/6 y, si esto ocurre, quedan tres blancas entre cinco tarjetas. Por eso, la probabilidad es (4/6) × (3/5) = 2/5. La opción 4/9 supone reposición, 2/3 considera solo la primera extracción y 1/3 no corresponde al producto requerido."},{"c":"Un centro deportivo cobra una inscripción única de $12.000 y una tarifa de $3.500 por cada clase a la que asiste una persona. Durante el primer mes, una usuaria pagó exactamente $40.000 en total. No recibió descuentos ni pagó otros servicios, y todas sus clases tuvieron la misma tarifa.","g":null,"q":"¿A cuántas clases asistió la usuaria durante ese mes?","o":["6 clases","10 clases","8 clases","12 clases"],"k":2,"e":"Si n es el número de clases, se cumple 12.000 + 3.500n = 40.000. Al restar la inscripción y dividir, se obtiene n = 28.000 ÷ 3.500 = 8. Las otras cantidades producen pagos totales diferentes de $40.000."},{"c":"En una función de teatro, la entrada para adultos cuesta $18.000 y la entrada infantil cuesta $10.000. Un grupo compró veinte entradas y pagó $280.000. Todas las entradas pertenecen a una de estas dos categorías, y no se aplicaron descuentos ni cobros adicionales a la compra.","g":null,"q":"¿Cuántas entradas para adultos compró el grupo?","o":["10 entradas para adultos","8 entradas para adultos","12 entradas para adultos","15 entradas para adultos"],"k":0,"e":"Si las veinte entradas fueran infantiles, costarían $200.000; cada entrada adulta añade $8.000 a ese valor. La diferencia de $80.000 corresponde a 80.000 ÷ 8.000 = 10 entradas adultas. Las otras cantidades, junto con las entradas infantiles restantes, no suman $280.000."},{"c":"Una empresa de transporte cobra una tarifa inicial de $6.000 por cada viaje y agrega $1.800 por cada kilómetro recorrido. El cobro depende únicamente de la distancia y no incluye recargos por horario, tiempo de espera o equipaje. Una pasajera realiza un trayecto cuya longitud exacta es de cinco kilómetros.","g":null,"q":"¿Cuál es el costo total del viaje?","o":["$9.000","$7.800","$30.000","$15.000"],"k":3,"e":"El costo se modela con C = 6.000 + 1.800d, donde d es la distancia en kilómetros. Para cinco kilómetros, C = 6.000 + 9.000 = $15.000. Las otras opciones omiten la tarifa inicial, cobran solo un kilómetro o multiplican incorrectamente el cobro fijo."},{"c":"Un tanque contiene inicialmente 120 litros de agua. Mientras una válvula permanece abierta, el volumen disponible se representa mediante V(t) = 120 − 4t, donde t es el tiempo en minutos y V(t) se mide en litros. El modelo se utiliza solamente desde la apertura de la válvula hasta que el tanque queda vacío.","g":null,"q":"¿Qué significa el número −4 en este modelo?","o":["El tanque tenía inicialmente 4 litros de agua.","El volumen disminuye 4 litros por cada minuto.","El tanque queda vacío después de 4 minutos.","El volumen aumenta 4 litros por cada minuto."],"k":1,"e":"El coeficiente de t indica el cambio del volumen por cada minuto, y su signo negativo señala una disminución. Así, salen 4 litros por minuto. El volumen inicial es 120 litros y el tanque se vacía en 30 minutos, por lo que las otras interpretaciones son incorrectas."},{"c":"Un patio rectangular mide 12 metros de largo y 8 metros de ancho. Se construirá un sendero de un metro de ancho por todo el borde interior del patio. La región rectangular que queda en el centro se cubrirá con césped, sin incluir ninguna parte del sendero.","g":null,"q":"¿Qué área se cubrirá con césped?","o":["96 m²","77 m²","60 m²","36 m²"],"k":2,"e":"El sendero ocupa un metro en cada extremo, de modo que el rectángulo central mide 12 − 2 = 10 metros por 8 − 2 = 6 metros. Su área es 10 × 6 = 60 m². Las otras opciones corresponden al área total, a descontar solo un metro por dimensión o al área del sendero."},{"c":"Para una actividad de ciencias se utiliza un recipiente cilíndrico de radio interior igual a 3 centímetros y altura interior de 10 centímetros. Se desea llenarlo completamente con agua. El recipiente no tiene irregularidades y, para todos los cálculos de esta actividad, se debe usar π = 3,14.","g":null,"q":"¿Cuál es la capacidad del recipiente en centímetros cúbicos?","o":["282,6 cm³","94,2 cm³","188,4 cm³","28,26 cm³"],"k":0,"e":"El volumen de un cilindro es V = πr²h, así que V = 3,14 × 3² × 10 = 282,6 cm³. La opción 94,2 no eleva el radio al cuadrado, y 188,4 usa una expresión asociada a la circunferencia. La opción 28,26 omite multiplicar por la altura."},{"c":"Una escalera recta de 13 metros se apoya contra una pared vertical sobre un terreno horizontal. El extremo inferior de la escalera está a 5 metros de la base de la pared. La pared y el suelo forman un ángulo recto, y se desprecia el grosor de la escalera.","g":null,"q":"¿A qué altura del suelo llega el extremo superior de la escalera?","o":["8 metros","18 metros","√194 metros","12 metros"],"k":3,"e":"La escalera es la hipotenusa, por lo que la altura h cumple h² + 5² = 13². Entonces h² = 144 y h = 12 metros. Restar o sumar directamente las longitudes no aplica, y √194 resulta de tratar incorrectamente la escalera como un cateto."},{"c":"Seis estudiantes se postulan para integrar un comité de dos representantes de curso. Los dos integrantes tendrán las mismas funciones y no habrá cargos distintos dentro del comité. Cada estudiante puede ser elegido una sola vez, y se desea contar todos los comités diferentes que pueden formarse.","g":null,"q":"¿Cuántos comités distintos pueden elegirse?","o":["30 comités","15 comités","12 comités","36 comités"],"k":1,"e":"Hay 6 × 5 formas de escoger dos estudiantes en orden, pero cada pareja se cuenta dos veces. Por eso, el número de comités es (6 × 5) ÷ 2 = 15. La opción 30 distingue órdenes que no importan, 36 permite repeticiones y 12 no cuenta todas las parejas."},{"c":"En un auditorio, la primera fila tiene 7 sillas, la segunda tiene 11 y la tercera tiene 15. El diseño continúa agregando exactamente cuatro sillas en cada fila respecto de la anterior. Todas las filas siguen este patrón y se numeran de manera consecutiva desde la primera.","g":null,"q":"¿Cuántas sillas tiene la fila número 12?","o":["48 sillas","55 sillas","51 sillas","44 sillas"],"k":2,"e":"El término de la fila n es 7 + 4(n − 1), pues desde la primera fila se realizan n − 1 incrementos. Para n = 12 se obtiene 7 + 4 × 11 = 51 sillas. Las otras opciones omiten las siete sillas iniciales o cuentan incorrectamente los incrementos."},{"c":"Una persona deposita $800.000 en un producto de ahorro que paga interés simple del 1,5 % mensual durante cuatro meses. Esto significa que cada mes el interés se calcula sobre los $800.000 iniciales, sin sumar intereses anteriores al capital. No hay comisiones, impuestos ni retiros durante ese periodo.","g":null,"q":"¿Cuánto dinero tendrá al finalizar los cuatro meses?","o":["$848.000","$812.000","$48.000","$849.091,24"],"k":0,"e":"El interés mensual es $800.000 × 0,015 = $12.000, por lo que en cuatro meses se generan $48.000. Al sumar el capital inicial se obtienen $848.000. Las otras opciones consideran un solo mes, únicamente los intereses o un esquema de interés compuesto."},{"c":"Un vivero inicia un programa con 500 plantas. Durante cada uno de los dos meses siguientes, la cantidad de plantas aumenta un 20 % respecto de la cantidad existente al comienzo de ese mes. No se pierden plantas y el crecimiento del segundo mes se calcula sobre el total alcanzado después del primero.","g":null,"q":"¿Cuántas plantas habrá al terminar el segundo mes?","o":["600 plantas","700 plantas","750 plantas","720 plantas"],"k":3,"e":"Después del primer mes hay 500 × 1,20 = 600 plantas y después del segundo hay 600 × 1,20 = 720. El crecimiento porcentual se aplica sucesivamente sobre una base que cambia. Las otras opciones consideran solo un mes, suman ambos porcentajes sobre el valor inicial o usan un factor incorrecto."},{"c":"Durante un experimento, la altura de una pelota se modela mediante h(t) = −5t² + 20t + 1, donde t se mide en segundos y h(t) en metros. El modelo describe el movimiento desde el lanzamiento hasta que la pelota toca el suelo. Se desea determinar la mayor altura alcanzada.","g":null,"q":"¿Cuál es la altura máxima de la pelota según el modelo?","o":["20 metros","21 metros","1 metro","41 metros"],"k":1,"e":"Como el coeficiente de t² es negativo, la parábola tiene un máximo en t = −20/(2 × −5) = 2 segundos. Al evaluar, h(2) = −20 + 40 + 1 = 21 metros. Las demás opciones confunden un coeficiente o la altura inicial con el máximo, o calculan incorrectamente la función."},{"c":"Un grupo de danza está integrado únicamente por niñas y niños. La razón entre el número de niñas y el número de niños es de 3 a 2, respectivamente. En total participan 35 estudiantes, y la coordinadora necesita conocer cuántas niñas hay para distribuir los vestuarios.","g":null,"q":"¿Cuántas niñas integran el grupo?","o":["14 niñas","17 niñas","21 niñas","23 niñas"],"k":2,"e":"La razón tiene 3 + 2 = 5 partes, y cada parte equivale a 35 ÷ 5 = 7 estudiantes. Las niñas representan tres partes, es decir, 3 × 7 = 21. La opción 14 corresponde a los niños y las otras cantidades no mantienen la razón indicada."},{"c":"Un plano de una zona rural está elaborado a escala 1:50.000, lo que significa que un centímetro en el plano representa 50.000 centímetros en el terreno. La distancia en línea recta entre una escuela y una estación de salud mide 3,6 centímetros en el plano.","g":null,"q":"¿Cuál es la distancia real en línea recta entre esos lugares?","o":["1,8 kilómetros","18 kilómetros","0,18 kilómetros","180 kilómetros"],"k":0,"e":"La distancia real es 3,6 × 50.000 = 180.000 centímetros. Como un kilómetro equivale a 100.000 centímetros, la distancia es 1,8 kilómetros. Las demás opciones desplazan incorrectamente la coma al convertir las unidades."},{"c":"Una planta de bebidas dispone de un tanque que contiene exactamente 1,2 metros cúbicos de jugo. Todo el contenido se envasará en botellas de 750 mililitros, llenadas hasta esa capacidad. Se supone que no se derrama líquido y que no quedan residuos en el tanque ni en los conductos.","g":null,"q":"¿Cuántas botellas completas se pueden llenar?","o":["16 botellas","160 botellas","900 botellas","1.600 botellas"],"k":3,"e":"Un metro cúbico equivale a 1.000.000 de mililitros, así que hay 1.200.000 mililitros de jugo. Al dividir 1.200.000 entre 750 se obtienen 1.600 botellas. Las otras opciones usan conversiones incorrectas o no dividen el volumen total entre la capacidad de cada botella."},{"c":"La nota final de una asignatura se calcula con dos componentes: un proyecto que vale el 30 % y un examen que vale el 70 %. Ambos se califican en una escala de 0 a 5. Una estudiante obtuvo 4,0 en el proyecto y 3,0 en el examen, sin bonificaciones adicionales.","g":null,"q":"¿Cuál es la nota final de la estudiante?","o":["3,5","3,3","3,7","4,0"],"k":1,"e":"La nota final es 0,30 × 4,0 + 0,70 × 3,0 = 1,2 + 2,1 = 3,3. No se usa la media simple porque los componentes tienen pesos distintos. La opción 3,7 intercambia los pesos y 4,0 ignora el resultado del examen."},{"c":"Una familia dispone de 40 metros de malla para cercar los cuatro lados de un huerto rectangular. No habrá puertas ni divisiones internas, y se utilizará toda la malla. Las dimensiones pueden ser cualquier par de números positivos cuya suma permita mantener el perímetro indicado.","g":null,"q":"¿Cuál es la mayor área que puede tener el huerto?","o":["80 m²","96 m²","100 m²","400 m²"],"k":2,"e":"Si un lado mide x, el otro mide 20 − x, porque el perímetro es 40 metros. El área es x(20 − x) = 100 − (x − 10)², cuyo máximo es 100 m² cuando ambos lados miden 10 metros. Las áreas de 80 y 96 m² son posibles pero no máximas, y 400 m² no es compatible con ese perímetro."}],"Biología":[{"c":"Una célula del páncreas produce una hormona de naturaleza proteica y la libera a la sangre. Durante este proceso, la proteína recién sintetizada ingresa al retículo endoplasmático rugoso y luego es transportada en vesículas hacia otro organelo. Allí experimenta modificaciones y se clasifica antes de ser enviada a la membrana celular para su secreción.","g":null,"q":"¿Qué organelo realiza principalmente las modificaciones y la clasificación descritas?","o":["El lisosoma, que degrada sustancias mediante enzimas.","El aparato de Golgi, que procesa y distribuye proteínas.","La mitocondria, que participa en la producción de ATP.","El nucléolo, que interviene en la formación de ribosomas."],"k":1,"e":"El aparato de Golgi recibe proteínas del retículo endoplasmático, las modifica y las clasifica para enviarlas a diferentes destinos. Los lisosomas participan principalmente en la degradación, mientras que las mitocondrias intervienen en la producción de ATP. El nucléolo participa en la formación de las subunidades ribosómicas, no en la clasificación de proteínas para su secreción."},{"c":"En una práctica se colocan células vegetales en una solución cuya concentración de solutos es mayor que la del interior celular. La membrana permite el paso de agua, pero no el de los solutos considerados. Después de unos minutos, el contenido de las células disminuye de volumen y la membrana se separa parcialmente de la pared celular.","g":null,"q":"¿Cuál explicación corresponde al cambio observado?","o":["Los solutos externos entraron por difusión y aumentaron el volumen celular.","La pared celular expulsó agua mediante transporte activo.","El agua salió por ósmosis hacia la solución más concentrada.","La membrana se transformó en una estructura impermeable al agua."],"k":2,"e":"El agua sale de la célula por ósmosis cuando el medio externo tiene una mayor concentración de solutos que no atraviesan la membrana. Esta pérdida de agua puede producir plasmólisis, es decir, la separación de la membrana respecto de la pared celular. Las otras opciones contradicen la permeabilidad descrita o atribuyen transporte activo a la pared celular."},{"c":"Un grupo de estudiantes cultiva algas con agua cuyo oxígeno contiene una marca isotópica que permite seguir su recorrido. El dióxido de carbono suministrado no contiene esa marca. Después de iluminar el cultivo, los estudiantes encuentran la marca en el oxígeno gaseoso liberado, mientras las algas continúan incorporando carbono para producir compuestos orgánicos.","g":null,"q":"¿Qué conclusión está directamente respaldada por este resultado?","o":["El oxígeno gaseoso liberado durante la fotosíntesis proviene del agua.","El carbono de los compuestos orgánicos proviene del oxígeno gaseoso.","El dióxido de carbono se convierte directamente en oxígeno gaseoso.","La luz aporta los átomos de oxígeno liberados por las algas."],"k":0,"e":"La marca permite identificar al agua como fuente del oxígeno gaseoso liberado en la fotosíntesis. Durante las reacciones dependientes de la luz, el agua se descompone y se libera oxígeno. El carbono incorporado procede del dióxido de carbono, y la luz aporta energía, no átomos."},{"c":"Se comparan dos cultivos iguales de células animales, ambos con glucosa y oxígeno disponibles. A uno se le añade una sustancia que bloquea la cadena de transporte de electrones de las mitocondrias, sin afectar directamente la glucólisis. En ese cultivo disminuye el consumo de oxígeno y se reduce notablemente la cantidad de ATP producido.","g":null,"q":"¿Por qué disminuye la producción de ATP en el cultivo tratado?","o":["Porque la sustancia impide que el ADN se replique.","Porque el oxígeno es el combustible que reemplaza a la glucosa.","Porque toda la producción de ATP ocurre dentro del núcleo.","Porque se interrumpe la producción de ATP asociada a la fosforilación oxidativa."],"k":3,"e":"La cadena de transporte de electrones genera el gradiente que permite producir ATP mediante fosforilación oxidativa. Su bloqueo reduce este aporte, aunque la glucólisis todavía puede generar una cantidad menor de ATP. Las otras opciones atribuyen el efecto a procesos no descritos o confunden la función del oxígeno, que actúa como aceptor final de electrones."},{"c":"En una especie de planta, el alelo A determina flores moradas y domina completamente sobre el alelo a, que determina flores blancas. Se cruzan dos plantas heterocigotas, ambas con genotipo Aa. Para este ejercicio se supone que los alelos se segregan de acuerdo con el modelo mendeliano y que todos los descendientes tienen la misma probabilidad de sobrevivir.","g":null,"q":"¿Cuál es la probabilidad de que un descendiente tenga flores blancas?","o":["0 %, porque ambos progenitores tienen flores moradas.","25 %, porque debe recibir el alelo a de cada progenitor.","50 %, porque cada progenitor posee un alelo a.","75 %, porque el alelo A es dominante."],"k":1,"e":"El cruce Aa × Aa produce las combinaciones AA, Aa, Aa y aa con igual probabilidad. Solo aa presenta flores blancas, por lo que la probabilidad es 1 de 4, equivalente al 25 %. Las demás opciones confunden el fenotipo de los progenitores, la presencia de un alelo recesivo o la dominancia con la probabilidad del cruce."},{"c":"Una enfermedad autosómica recesiva se manifiesta únicamente en personas con genotipo dd. Una pareja sin síntomas se realiza una prueba genética y ambos integrantes resultan heterocigotos Dd. Ya tienen un hijo sin la enfermedad y desean conocer el riesgo para un segundo hijo. Se supone que no existen otros factores que alteren la herencia del rasgo.","g":null,"q":"¿Cuál es la probabilidad de que el segundo hijo presente la enfermedad?","o":["25 %, porque cada nacimiento constituye un evento independiente.","0 %, porque el primer hijo no presentó la enfermedad.","50 %, porque uno de los dos hijos debe estar afectado.","100 %, porque ambos progenitores tienen el alelo d."],"k":0,"e":"Cada progenitor tiene una probabilidad de 1/2 de aportar el alelo d, de modo que la probabilidad de dd es 1/2 × 1/2 = 1/4. El resultado del primer nacimiento no modifica la probabilidad del segundo. Tener el alelo recesivo no garantiza transmitirlo, y las proporciones mendelianas no obligan a que un número específico de hijos resulte afectado."},{"c":"En un modelo simplificado de un ecosistema, los productores almacenan 20 000 kJ de energía en su biomasa durante un periodo. La cadena alimentaria considerada está formada por productores, saltamontes y ranas. Se establece que, en cada transferencia entre niveles consecutivos, el consumidor incorpora a su biomasa el 10 % de la energía almacenada en el nivel anterior.","g":null,"q":"¿Cuánta energía incorporan las ranas a su biomasa según este modelo?","o":["20 kJ.","2 000 kJ.","200 kJ.","18 000 kJ."],"k":2,"e":"Los saltamontes incorporan 20 000 × 0,10 = 2 000 kJ, y las ranas incorporan 2 000 × 0,10 = 200 kJ. Se requieren dos transferencias desde los productores hasta las ranas. Las otras cantidades corresponden a una transferencia, a un cálculo adicional no solicitado o a una proporción que no representa la energía incorporada."},{"c":"En una laguna, unos peces depredadores consumen pequeños crustáceos que se alimentan de algas. Una actividad pesquera reduce fuertemente la población de esos peces. Durante el periodo analizado no cambian de manera importante la entrada de nutrientes, la iluminación ni otras fuentes de alimento, y los crustáceos no tienen otro depredador relevante.","g":null,"q":"¿Qué cambio se espera inicialmente como consecuencia de la reducción de los peces?","o":["Una disminución de crustáceos y un aumento de algas.","Un aumento simultáneo de peces y crustáceos.","Una disminución de algas causada por un mayor consumo de los peces.","Un aumento de crustáceos y una disminución de algas."],"k":3,"e":"Al disminuir los peces, se reduce la depredación sobre los crustáceos y su población puede aumentar. Una mayor cantidad de crustáceos incrementa el consumo de algas, lo que puede reducirlas. Las otras opciones invierten estas relaciones o atribuyen a los peces un consumo de algas que no está descrito."},{"c":"Antes de aplicar un antibiótico, una población bacteriana contiene unas pocas bacterias con una variante heredable que les permite resistirlo. Después del tratamiento, la mayoría de las bacterias sensibles muere y las resistentes sobreviven y se reproducen. Tras varias generaciones en presencia del medicamento, la variante de resistencia es mucho más frecuente.","g":null,"q":"¿Qué mecanismo explica mejor el aumento de la resistencia?","o":["Las bacterias sensibles decidieron modificar sus genes para sobrevivir.","El antibiótico favoreció la supervivencia y reproducción de variantes resistentes preexistentes.","Todas las bacterias adquirieron la misma mutación dirigida por el medicamento.","La resistencia surgió porque las bacterias dejaron de transmitir sus genes."],"k":1,"e":"El tratamiento actúa como una presión de selección que favorece a las bacterias resistentes que ya estaban presentes. Al reproducirse, estas transmiten la variante y aumentan su frecuencia en la población. La selección natural no implica decisiones de los organismos, mutaciones dirigidas por una necesidad ni interrupción de la herencia."},{"c":"Una tormenta transporta al azar diez lagartijas desde una población continental hasta una isla sin lagartijas. Por casualidad, ocho de las diez tienen un alelo que era poco frecuente en el continente. En la isla, ese alelo no modifica la supervivencia ni la reproducción, pero permanece frecuente en las primeras generaciones de descendientes.","g":null,"q":"¿Cuál proceso explica principalmente la diferencia inicial entre las dos poblaciones?","o":["El efecto fundador, una forma de deriva genética.","La selección natural a favor de un alelo ventajoso.","La aparición simultánea de la misma mutación en todas las lagartijas.","El flujo génico continuo desde una población insular hacia el continente."],"k":0,"e":"El efecto fundador ocurre cuando unos pocos individuos establecen una población con frecuencias alélicas diferentes por azar. En este caso, el alelo no ofrece una ventaja reproductiva, por lo que no se requiere selección natural para explicar su frecuencia inicial. Tampoco se describen mutaciones nuevas ni intercambio continuo de individuos entre las poblaciones."},{"c":"Los alvéolos pulmonares tienen paredes delgadas y proporcionan una gran superficie para el intercambio de gases con la sangre. En una enfermedad, parte de las paredes alveolares se destruye y varios espacios pequeños se unen en espacios mayores. Aunque el volumen de aire dentro del pulmón puede mantenerse, la superficie total disponible para el intercambio disminuye.","g":null,"q":"¿Qué consecuencia se espera de la disminución de la superficie alveolar?","o":["Un aumento del intercambio de oxígeno porque hay espacios de aire mayores.","La transformación del dióxido de carbono en oxígeno dentro del pulmón.","Una menor capacidad para transferir oxígeno desde el aire hacia la sangre.","La interrupción inmediata de la producción de glóbulos rojos."],"k":2,"e":"Una menor superficie alveolar reduce el área disponible para la difusión de oxígeno hacia la sangre. El volumen de aire por sí solo no determina la eficiencia del intercambio gaseoso. Los pulmones no transforman dióxido de carbono en oxígeno, y la destrucción de paredes alveolares no implica una interrupción inmediata de la formación de glóbulos rojos."},{"c":"Después de una comida rica en carbohidratos, aumenta la concentración de glucosa en la sangre de una persona sana. Como respuesta, el páncreas libera insulina, que favorece la entrada de glucosa en ciertos tejidos y su almacenamiento. A medida que la glucemia regresa al intervalo habitual, disminuye el estímulo que promovía la liberación de insulina.","g":null,"q":"¿Qué característica permite identificar este mecanismo como retroalimentación negativa?","o":["La respuesta amplifica de manera continua el aumento inicial de glucosa.","La hormona elimina la necesidad de medir la glucosa sanguínea.","El páncreas mantiene siempre la misma secreción, independientemente de la glucemia.","La respuesta contrarresta el cambio inicial y reduce el estímulo que la activa."],"k":3,"e":"La retroalimentación negativa genera una respuesta que se opone a la alteración inicial, en este caso el aumento de glucosa. Al recuperar el intervalo habitual, disminuye el estímulo para secretar insulina. Las otras opciones describen amplificación, ausencia de regulación o secreción constante, características incompatibles con el mecanismo presentado."},{"c":"Una estudiante coloca el extremo cortado del tallo de una flor blanca en agua con un colorante soluble. Después de varias horas, observa coloración en los pétalos. Al examinar cortes del tallo, encuentra el colorante dentro de los vasos del xilema. La flor permanece en un lugar iluminado y sus hojas pierden agua hacia el ambiente.","g":null,"q":"¿Qué proceso explica mejor el ascenso del agua coloreada?","o":["La transpiración contribuye a generar tensión que mueve agua por el xilema.","El floema transporta el colorante porque su función principal es conducir agua del suelo.","Los pétalos producen colorante y lo envían hacia abajo por el tallo.","El agua asciende únicamente porque todas las células del xilema se contraen."],"k":0,"e":"La pérdida de agua por transpiración contribuye a generar una tensión que favorece el ascenso del agua por el xilema. La cohesión entre moléculas de agua ayuda a mantener la columna dentro de los vasos. El floema transporta principalmente sustancias orgánicas, los pétalos no producen el colorante suministrado y los vasos maduros del xilema no bombean mediante contracciones."},{"c":"Un curso quiere investigar si la intensidad de la luz afecta el crecimiento de plántulas de una misma especie. Dispone de semillas del mismo lote, recipientes idénticos y lámparas regulables. Para comparar los tratamientos, medirá el incremento de biomasa seca después de tres semanas y distribuirá las plántulas al azar entre los grupos.","g":null,"q":"¿Cuál diseño permite evaluar mejor el efecto de la intensidad luminosa?","o":["Usar distintas intensidades y cambiar también el fertilizante de cada grupo.","Mantener una sola intensidad y comparar plantas de especies diferentes.","Usar varias intensidades, con réplicas, y mantener iguales el agua, el sustrato y la temperatura.","Dar más agua a las plantas menos iluminadas y usar un solo individuo por tratamiento."],"k":2,"e":"La intensidad luminosa debe ser la variable que cambia deliberadamente, mientras las demás condiciones se mantienen comparables. Las réplicas permiten estimar la variación entre plantas y hacen más confiable la comparación. Cambiar fertilizante, especie o cantidad de agua introduce factores de confusión, y una sola intensidad no permite contrastar su efecto."},{"c":"Durante un semestre, estudiantes observan que los sectores de un lago con mayor concentración de fosfatos también presentan mayor abundancia de algas. Sin embargo, esos sectores tienen temperaturas y condiciones de circulación diferentes. El grupo propone que los fosfatos causan el aumento de algas y desea realizar una prueba que distinga ese efecto de otros factores.","g":null,"q":"¿Qué procedimiento aportaría la evidencia más adecuada para evaluar la hipótesis causal?","o":["Medir únicamente los sectores con muchas algas y descartar los demás.","Asignar al azar distintas dosis de fosfatos a cultivos replicados y mantener iguales las otras condiciones.","Suponer que toda asociación observada demuestra una relación de causa y efecto.","Comparar lagos diferentes sin registrar sus temperaturas ni su circulación."],"k":1,"e":"Manipular la cantidad de fosfatos y controlar las demás condiciones permite evaluar su efecto sobre las algas. La asignación aleatoria y las réplicas reducen sesgos y permiten estimar la variabilidad. La asociación inicial no demuestra por sí sola causalidad, y las otras propuestas mantienen o aumentan los factores de confusión."},{"c":"Para practicar la transcripción, un estudiante recibe un fragmento de la hebra molde de ADN escrito como 3′-TAC GGA CTT-5′. Se le indica que la ARN polimerasa lee esta hebra en dirección 3′ a 5′ y construye un ARN complementario en dirección 5′ a 3′. El ejercicio solo requiere aplicar las reglas de apareamiento de bases.","g":null,"q":"¿Cuál es la secuencia del ARN producido a partir del fragmento?","o":["5′-TAC GGA CTT-3′.","5′-ATG CCT GAA-3′.","5′-UAC GGA CUU-3′.","5′-AUG CCU GAA-3′."],"k":3,"e":"En la transcripción, A del ADN se aparea con U del ARN, T con A, C con G y G con C. Por eso, la hebra molde indicada produce 5′-AUG CCU GAA-3′. Las otras opciones conservan timina, copian la hebra molde sin complementar o corresponden a una secuencia de ADN."},{"c":"En un gen ocurre una sustitución de una base que cambia un codón del ARN mensajero de GAA a GAG. Para resolver el caso, se informa que ambos codones especifican el aminoácido ácido glutámico. La sustitución ocurre dentro de la región codificante y no altera el procesamiento del ARN ni la cantidad de proteína producida.","g":null,"q":"¿Cuál es el efecto directo esperado sobre la secuencia de aminoácidos de la proteína?","o":["No cambia, porque los dos codones especifican el mismo aminoácido.","Pierde todos los aminoácidos posteriores porque GAG es un codón de terminación.","Cambia su marco de lectura porque se añadió una base al ARN.","Incorpora un aminoácido adicional porque cada codón nuevo alarga la proteína."],"k":0,"e":"La sustitución es sinónima porque GAA y GAG codifican el mismo aminoácido. Bajo las condiciones descritas, la secuencia de aminoácidos permanece igual. No se genera un codón de terminación, no hay inserción que cambie el marco de lectura y el número de codones tampoco aumenta."},{"c":"Una especie animal tiene 12 cromosomas en sus células somáticas diploides. En sus órganos reproductores, las células precursoras de gametos duplican el ADN y luego realizan meiosis. Para este ejercicio se supone que los cromosomas se separan normalmente y que no ocurren errores de distribución durante ninguna de las dos divisiones meióticas.","g":null,"q":"¿Cuántos cromosomas tendrá cada gameto al finalizar la meiosis?","o":["3 cromosomas.","6 cromosomas.","12 cromosomas.","24 cromosomas."],"k":1,"e":"La meiosis reduce a la mitad el número de cromosomas: si 2n = 12, entonces n = 6. Aunque el ADN se duplica antes de la primera división, el resultado normal son células haploides. Las otras cantidades confunden las dos divisiones con reducciones sucesivas del número haploide, o confunden duplicación del ADN con aumento final del número cromosómico."},{"c":"Una célula de la piel posee 46 cromosomas antes de duplicar su ADN. Luego completa la fase de replicación y realiza una mitosis normal, seguida de la división del citoplasma. El objetivo de este proceso es producir nuevas células para renovar el tejido, sin modificar el número de cromosomas característico de las células somáticas.","g":null,"q":"¿Cuál será el resultado respecto al número de cromosomas en las células hijas?","o":["Una célula con 92 cromosomas y otra sin cromosomas.","Dos células con 23 cromosomas cada una.","Cuatro células con 46 cromosomas cada una.","Dos células con 46 cromosomas cada una."],"k":3,"e":"La mitosis distribuye las copias del material genético de manera que cada célula hija conserva 46 cromosomas. La replicación duplica el ADN, pero no produce células hijas con el doble del número cromosómico. La formación de cuatro células haploides corresponde a la meiosis, y una distribución desigual no representa una mitosis normal."},{"c":"En una región, ciertas aves consumen frutos y expulsan semillas viables lejos de la planta de origen. Las aves obtienen alimento, y las semillas transportadas tienen mayores oportunidades de establecerse en sitios adecuados. Al impedir experimentalmente el acceso de las aves, disminuye la dispersión de semillas, sin que se observe daño directo de las aves sobre las plantas.","g":null,"q":"¿Cómo se clasifica la interacción descrita entre las aves y las plantas?","o":["Parasitismo, porque las aves obtienen alimento a costa de dañar necesariamente la planta.","Competencia, porque ambas especies requieren exactamente el mismo alimento.","Mutualismo, porque ambas especies reciben un beneficio.","Comensalismo, porque solo las aves se benefician y las plantas no son afectadas."],"k":2,"e":"La interacción es mutualista porque las aves reciben alimento y las plantas obtienen dispersión de sus semillas. El beneficio para las plantas está respaldado por la disminución de dispersión cuando se excluyen las aves. No se describe daño propio del parasitismo, disputa por un mismo recurso ni ausencia de efecto sobre una de las especies."},{"c":"Dos especies de lagartijas consumen los mismos insectos en un bosque. Cuando habitan separadas, ambas buscan alimento tanto en el suelo como en los troncos. Cuando conviven, una se alimenta principalmente en el suelo y la otra en los troncos. Los insectos son limitados y el cambio reduce la coincidencia de los sitios de alimentación.","g":null,"q":"¿Qué interpretación explica mejor este cambio?","o":["La partición del recurso reduce la competencia interespecífica.","La depredación entre lagartijas aumenta porque usan sitios distintos.","Las dos especies dejan de necesitar alimento al convivir.","El cambio demuestra que ambas especies se volvieron genéticamente idénticas."],"k":0,"e":"Utilizar zonas diferentes reduce el solapamiento en el acceso a un recurso limitado y puede disminuir la competencia entre especies. Este patrón se conoce como partición de recursos o diferenciación del nicho. No demuestra depredación entre las lagartijas, desaparición de sus necesidades alimentarias ni identidad genética."},{"c":"En una zona boscosa se talan árboles y se quema gran parte de la biomasa retirada. Durante los años siguientes, el terreno conserva una cobertura vegetal mucho menor que antes. Para analizar el efecto sobre el ciclo del carbono, se consideran tanto la combustión inmediata como la disminución de la fotosíntesis posterior.","g":null,"q":"¿Cuál es el efecto esperado de estos procesos sobre el intercambio de carbono con la atmósfera?","o":["La combustión retira dióxido de carbono y la pérdida de árboles aumenta su captura.","El carbono desaparece del sistema porque el fuego destruye sus átomos.","La menor cobertura garantiza una mayor fijación de carbono por fotosíntesis.","La quema libera dióxido de carbono y la menor cobertura reduce su captura fotosintética."],"k":3,"e":"La combustión de biomasa transfiere parte de su carbono a la atmósfera como dióxido de carbono. Además, una menor cobertura vegetal reduce la capacidad fotosintética de capturarlo, manteniendo comparables las demás condiciones. Las otras opciones invierten estos procesos o suponen erróneamente que los átomos de carbono desaparecen."},{"c":"Un agricultor cultiva leguminosas que forman nódulos en sus raíces al asociarse con determinadas bacterias. Estas bacterias reciben compuestos orgánicos de la planta y convierten nitrógeno atmosférico en formas que pueden incorporarse a moléculas biológicas. Después de incorporar los restos del cultivo al suelo, parte de ese nitrógeno queda disponible para cultivos posteriores.","g":null,"q":"¿Qué proceso del ciclo del nitrógeno realizan principalmente las bacterias descritas?","o":["La desnitrificación, que devuelve nitrógeno gaseoso a la atmósfera.","La fijación biológica, que transforma N₂ en compuestos nitrogenados utilizables.","La fotosíntesis, que convierte directamente N₂ en glucosa.","La evaporación, que separa el nitrógeno de las raíces como vapor de agua."],"k":1,"e":"Las bacterias fijadoras transforman el nitrógeno atmosférico en compuestos como amoníaco, que pueden incorporarse a moléculas biológicas. Esta asociación puede aportar nitrógeno al sistema agrícola y beneficiar a cultivos posteriores. La desnitrificación tiene una dirección distinta, y ni la fotosíntesis ni la evaporación realizan la transformación descrita."},{"c":"Una empresa desarrolla una variedad de maíz que produce una proteína insecticida y propone cultivarla cerca de una población silvestre emparentada con la que puede cruzarse. Antes de autorizar un ensayo de campo, un comité debe evaluar posibles beneficios y riesgos ambientales. Todavía no se ha determinado si el rasgo podría pasar a esa población silvestre.","g":null,"q":"¿Cuál decisión combina mejor la evaluación científica y la responsabilidad ambiental?","o":["Autorizar su liberación ilimitada porque aumentar la producción elimina cualquier riesgo.","Rechazar toda evaluación porque cualquier modificación genética causa necesariamente el mismo daño.","Realizar un ensayo controlado con medidas de contención y seguimiento del flujo génico y de organismos no objetivo.","Evaluar únicamente el precio de las semillas, sin estudiar efectos ecológicos."],"k":2,"e":"Un ensayo controlado permite obtener evidencia sobre riesgos relevantes mientras se limita la exposición ambiental. El seguimiento del flujo génico y de organismos no objetivo responde a posibles efectos de la variedad propuesta. Los beneficios productivos no eliminan todos los riesgos, pero tampoco es válido atribuir daños inevitables a cualquier modificación sin evaluarla."},{"c":"Una vacuna presenta al sistema inmunitario un antígeno sin causar la enfermedad que se busca prevenir. Semanas después, una persona vacunada entra en contacto con el agente infeccioso correspondiente. En comparación con su primera exposición al antígeno, su respuesta específica se activa más rápidamente gracias a células que permanecieron después de la vacunación.","g":null,"q":"¿Qué componente explica principalmente la mayor rapidez de esta respuesta específica?","o":["Los linfocitos de memoria formados tras reconocer el antígeno.","Los glóbulos rojos, que almacenan información sobre todos los patógenos.","Las plaquetas, que producen anticuerpos específicos después de coagular.","Las enzimas digestivas, que identifican el antígeno en la sangre."],"k":0,"e":"Los linfocitos de memoria permanecen después de la primera respuesta y permiten responder con mayor rapidez ante el mismo antígeno. Esta memoria es una propiedad de la inmunidad adaptativa y constituye una base de la vacunación. Los glóbulos rojos transportan gases, las plaquetas participan en la coagulación y las enzimas digestivas no generan memoria inmunitaria."}],"Química":[{"c":"En una práctica escolar se mezclan arena limpia, sal de cocina y agua. La sal se disuelve por completo, mientras que la arena permanece como un sólido insoluble. El grupo dispone de papel filtro, embudos y un recipiente que puede calentarse. Su objetivo es recuperar por separado la arena y la sal sólida.","g":null,"q":"¿Qué secuencia de procedimientos permite alcanzar el objetivo?","o":["Filtrar la mezcla y evaporar el agua del filtrado.","Evaporar toda el agua y luego filtrar los sólidos secos.","Decantar el agua y separar la sal de la arena con un imán.","Tamizar la mezcla húmeda y recoger la sal en el tamiz."],"k":0,"e":"La filtración retiene la arena y deja pasar el agua con la sal disuelta; al evaporar el agua del filtrado, se recupera la sal. Evaporar primero deja ambos sólidos mezclados, un imán no separa estos materiales y el tamizado no recupera la sal disuelta."},{"c":"Un laboratorio necesita enriquecer en etanol una mezcla líquida de etanol y agua. A presión atmosférica, el etanol puro hierve aproximadamente a 78 °C y el agua pura a 100 °C. Ambos líquidos son miscibles. Se cuenta con un equipo que permite calentar la mezcla, conducir los vapores y condensarlos en otro recipiente.","g":null,"q":"¿Cuál procedimiento es el más apropiado para obtener una fracción enriquecida en etanol?","o":["Filtración, porque el etanol atraviesa el filtro y el agua queda retenida.","Destilación fraccionada, aprovechando la diferencia de volatilidad.","Decantación, porque el etanol forma una capa separada sobre el agua.","Separación magnética, aprovechando la composición de los líquidos."],"k":1,"e":"La destilación fraccionada permite obtener vapores y un condensado enriquecidos en el componente más volátil, que en este caso es el etanol. La filtración no separa líquidos miscibles, la decantación requiere fases separadas y ninguno de los líquidos puede separarse mediante un imán."},{"c":"Una estudiante compara sodio, magnesio y cloro, elementos que pertenecen al tercer período de la tabla periódica. Su docente explica que, al avanzar de izquierda a derecha en un período, generalmente aumenta la atracción efectiva del núcleo sobre los electrones y disminuye el radio atómico. La estudiante debe aplicar esta tendencia sin consultar valores numéricos.","g":null,"q":"¿Cuál orden de radios atómicos, de mayor a menor, es el esperado?","o":["Cloro > magnesio > sodio.","Magnesio > sodio > cloro.","Sodio > magnesio > cloro.","Sodio > cloro > magnesio."],"k":2,"e":"En el tercer período, el sodio está a la izquierda del magnesio y este a la izquierda del cloro, por lo que se espera que el radio disminuya en ese orden. Las demás opciones invierten al menos una de las relaciones establecidas por la tendencia periódica descrita."},{"c":"En una actividad se representan dos átomos neutros de carbono: carbono-12 y carbono-14. Ambos tienen número atómico 6, pero sus números másicos son 12 y 14, respectivamente. El número atómico corresponde a la cantidad de protones y el número másico corresponde a la suma de protones y neutrones presentes en el núcleo.","g":null,"q":"¿Qué diferencia existe entre estos dos átomos?","o":["El carbono-14 tiene dos protones más que el carbono-12.","El carbono-12 tiene dos electrones más que el carbono-14.","El carbono-14 tiene catorce neutrones y el carbono-12 tiene doce.","El carbono-14 tiene ocho neutrones y el carbono-12 tiene seis."],"k":3,"e":"Los neutrones se calculan restando el número atómico al número másico: 14 − 6 = 8 y 12 − 6 = 6. Ambos átomos tienen seis protones y, al ser neutros, seis electrones; los números másicos no indican directamente la cantidad de neutrones."},{"c":"El magnesio es un metal cuyos átomos tienden a perder dos electrones, mientras que el cloro es un no metal cuyos átomos tienden a ganar un electrón. Al reaccionar, forman un compuesto eléctricamente neutro. Para proponer su fórmula, un estudiante debe considerar tanto las cargas de los iones como la proporción necesaria para compensarlas.","g":null,"q":"¿Cuál fórmula y tipo de enlace corresponden al compuesto formado?","o":["MgCl₂, con enlace iónico entre Mg²⁺ y Cl⁻.","MgCl, con enlace iónico entre Mg²⁺ y Cl⁻.","Mg₂Cl, con enlace covalente entre átomos neutros.","MgCl₂, con enlace metálico entre todos sus componentes."],"k":0,"e":"Un ion Mg²⁺ requiere dos iones Cl⁻ para que la carga total sea cero, de modo que la fórmula es MgCl₂. MgCl no compensa las cargas, Mg₂Cl no representa la proporción requerida y el enlace entre estos iones no es metálico."},{"c":"Dos vasos contienen agua destilada: en uno se disuelve azúcar y en el otro, cloruro de sodio. Un circuito de prueba indica que la solución de sal conduce mucho mejor la electricidad que la solución de azúcar, bajo condiciones comparables. Se sabe que el azúcar permanece como moléculas neutras y la sal se disocia en agua.","g":null,"q":"¿Qué explica mejor la diferencia observada en la conductividad?","o":["Las moléculas de azúcar inmovilizan todos los electrones del agua.","La solución de sal contiene iones móviles que transportan carga.","La sal transforma el agua en un meta
